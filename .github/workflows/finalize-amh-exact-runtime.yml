# deploy marker: 20260814-optical-balance-7
name: Finalize AMH Exact Runtime

on:
  push:
    paths:
      - '.github/workflows/finalize-amh-exact-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify exact approved assets and local runtime
        run: |
          test "$(wc -c < assets/Reference/ATHLETE_MAIN_HEADSHOT_APPROVED_LOCKED_OVERLAY_v1.webp)" = "90626"
          test "$(sha256sum assets/Reference/ATHLETE_MAIN_HEADSHOT_APPROVED_LOCKED_OVERLAY_v1.webp | awk '{print $1}')" = "4507debfa0392b50a31a82c1b71b406f4bb841af5e94ae40e761edf56c94bf14"
          test "$(wc -c < assets/Reference/ATHLETE_MAIN_HEADSHOT_APPROVED_GLYPH_ATLAS_v1.webp)" = "323050"
          test "$(sha256sum assets/Reference/ATHLETE_MAIN_HEADSHOT_APPROVED_GLYPH_ATLAS_v1.webp | awk '{print $1}')" = "ab764e51db0ee2d46fbaa1ca3e43d6dc5c18f5cb0e994229566336864dec9b1f"
          ! grep -q "const BRIDGE=" athlete-main-headshot-approved-exact.js
          ! grep -q "bridgeJson" athlete-main-headshot-approved-exact.js
      - name: Apply strong optical tightening
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          r=Path('athlete-main-headshot-approved-exact.js')
          s=r.read_text()

          s=s.replace("function glyphScale(style,ch){return style==='small'&&ch==='W'?1.12:1}",
                      "function glyphScale(style,ch){return 1}",1)
          s=s.replace("drawRasterText(ctx,S.last,'large',48,967,205,-12,960);",
                      "drawRasterText(ctx,S.last,'large',48,967,205,-34,960);",1)
          s=s.replace("const VERSION='20260814-optical-balance-6';",
                      "const VERSION='20260814-optical-balance-7';",1)
          s=s.replace("?v=20260814-optical-balance-6",
                      "?v=20260814-optical-balance-7")
          r.write_text(s)

          p=Path('index.html')
          t=p.read_text()
          t,n=re.subn(r'athlete-main-headshot-approved-exact\.js\?v=[^"\']+',
                      'athlete-main-headshot-approved-exact.js?v=20260814-optical-balance-7',t)
          if n < 1:
              raise SystemExit('Exact renderer script tag not found in index.html')
          p.write_text(t)
          print('W normalized to 1.0; surname visible-edge tracking=-34; cache version=7.')
          PY
      - name: Verify strong typography refinement
        run: |
          grep -q "function glyphScale(style,ch){return 1}" athlete-main-headshot-approved-exact.js
          grep -q "drawRasterText(ctx,S.last,'large',48,967,205,-34,960)" athlete-main-headshot-approved-exact.js
          grep -q "20260814-optical-balance-7" athlete-main-headshot-approved-exact.js
      - name: Commit strong typography refinement
        run: |
          git config user.name 'rdeane-create'
          git config user.email 'rdeane@christchurchschool.org'
          git add athlete-main-headshot-approved-exact.js index.html
          if git diff --cached --quiet; then echo 'Typography refinement already installed.'; exit 0; fi
          git commit -m 'Make Athlete Main Headshot typography visibly tighter'
          git push origin HEAD:main
