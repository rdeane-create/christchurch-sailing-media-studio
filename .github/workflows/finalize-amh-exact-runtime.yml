name: Finalize AMH Exact Runtime

on:
  push:
    paths:
      - '.github/workflows/finalize-amh-exact-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact bridge compatibility fix
        run: bash tools/fix-amh-bridge.sh
      - name: Commit exact renderer fix
        run: |
          git config user.name 'rdeane-create'
          git config user.email 'rdeane@christchurchschool.org'
          git add athlete-main-headshot-approved-exact.js
          if git diff --cached --quiet; then
            echo 'Already fixed.'
            exit 0
          fi
          git commit -m 'Fix Athlete Main Headshot exact asset loading'
          git push
