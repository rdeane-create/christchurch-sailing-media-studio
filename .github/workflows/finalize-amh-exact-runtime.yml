# deploy marker: 20260814-optical-type-4
name: Finalize AMH Exact Runtime

on:
  push:
    paths:
      - '.github/workflows/finalize-amh-exact-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify exact approved assets and local runtime
        run: |
          test "$(wc -c < assets/Reference/ATHLETE_MAIN_HEADSHOT_APPROVED_LOCKED_OVERLAY_v1.webp)" = "90626"
          test "$(sha256sum assets/Reference/ATHLETE_MAIN_HEADSHOT_APPROVED_LOCKED_OVERLAY_v1.webp | awk '{print $1}')" = "4507debfa0392b50a31a82c1b71b406f4bb841af5e94ae40e761edf56c94bf14"
          test "$(wc -c < assets/Reference/ATHLETE_MAIN_HEADSHOT_APPROVED_GLYPH_ATLAS_v1.webp)" = "323050"
          test "$(sha256sum assets/Reference/ATHLETE_MAIN_HEADSHOT_APPROVED_GLYPH_ATLAS_v1.webp | awk '{print $1}')" = "ab764e51db0ee2d46fbaa1ca3e43d6dc5c18f5cb0e994229566336864dec9b1f"
          ! grep -q "const BRIDGE=" athlete-main-headshot-approved-exact.js
          ! grep -q "bridgeJson" athlete-main-headshot-approved-exact.js
      - name: Apply optical typography refinement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          r=Path('athlete-main-headshot-approved-exact.js')
          s=r.read_text()

          old_measure="function measure(text,style,height,tracking){let w=0;for(const ch of String(text||'').toUpperCase()){if(ch===' '){w+=height*.42+tracking;continue}const g=GLYPHS[style+':'+ch];if(!g)continue;const sc=height/g.h;w+=g.w*sc+tracking}return Math.max(0,w-tracking)}"
          new_measure="function opticalScale(style,ch){return style==='small'&&(ch==='W'||ch==='V')?.80:1} function measure(text,style,height,tracking){let w=0;for(const ch of String(text||'').toUpperCase()){if(ch===' '){w+=height*.42+tracking;continue}const g=GLYPHS[style+':'+ch];if(!g)continue;const gh=height*opticalScale(style,ch),sc=gh/g.h;w+=g.w*sc+tracking}return Math.max(0,w-tracking)}"
          if old_measure in s:
              s=s.replace(old_measure,new_measure,1)
          elif new_measure not in s:
              raise SystemExit('measure() pattern not found')

          old_draw="function drawRasterText(ctx,text,style,x,y,height,tracking,maxWidth){text=String(text||'').toUpperCase();let h=height,tr=tracking;const mw=measure(text,style,h,tr);if(maxWidth&&mw>maxWidth){const f=maxWidth/mw;h*=f;tr*=f}let cx=x;for(const ch of text){if(ch===' '){cx+=h*.42+tr;continue}const g=GLYPHS[style+':'+ch];if(!g)continue;const sc=h/g.h,dw=g.w*sc,dh=h;ctx.save();ctx.shadowColor='rgba(0,0,0,.62)';ctx.shadowBlur=Math.max(4,h*.055);ctx.shadowOffsetX=Math.max(3,h*.035);ctx.shadowOffsetY=Math.max(4,h*.045);ctx.drawImage(S.atlas,g.x,g.y,g.w,g.h,cx,y,dw,dh);ctx.restore();cx+=dw+tr}}"
          new_draw="function drawRasterText(ctx,text,style,x,y,height,tracking,maxWidth){text=String(text||'').toUpperCase();let h=height,tr=tracking;const mw=measure(text,style,h,tr);if(maxWidth&&mw>maxWidth){const f=maxWidth/mw;h*=f;tr*=f}let cx=x;for(const ch of text){if(ch===' '){cx+=h*.42+tr;continue}const g=GLYPHS[style+':'+ch];if(!g)continue;const gh=h*opticalScale(style,ch),sc=gh/g.h,dw=g.w*sc,dh=gh,gy=y+(h-dh);ctx.save();ctx.shadowColor='rgba(0,0,0,.62)';ctx.shadowBlur=Math.max(4,h*.055);ctx.shadowOffsetX=Math.max(3,h*.035);ctx.shadowOffsetY=Math.max(4,h*.045);ctx.drawImage(S.atlas,g.x,g.y,g.w,g.h,cx,gy,dw,dh);ctx.restore();cx+=dw+tr}}"
          if old_draw in s:
              s=s.replace(old_draw,new_draw,1)
          elif new_draw not in s:
              raise SystemExit('drawRasterText() pattern not found')

          s=s.replace("drawRasterText(ctx,S.first,'small',76,887,58,18,710);","drawRasterText(ctx,S.first,'small',76,887,58,5,710);",1)
          s=s.replace("drawRasterText(ctx,S.last,'large',48,967,205,-18,960);","drawRasterText(ctx,S.last,'large',48,967,205,-28,960);",1)

          s=s.replace("const VERSION='20260814-name-spacing-3';","const VERSION='20260814-optical-type-4';")
          s=s.replace("?v=20260814-name-spacing-3","?v=20260814-optical-type-4")
          r.write_text(s)

          p=Path('index.html')
          t=p.read_text()
          t,n=re.subn(r'athlete-main-headshot-approved-exact\.js\?v=[^"\']+', 'athlete-main-headshot-approved-exact.js?v=20260814-optical-type-4', t)
          if n < 1:
              raise SystemExit('Exact renderer script tag not found in index.html')
          p.write_text(t)

          print('Applied optical V/W normalization=.80; first tracking=5; surname tracking=-28; vertical geometry unchanged.')
          PY
      - name: Commit optical typography refinement
        run: |
          git config user.name 'rdeane-create'
          git config user.email 'rdeane@christchurchschool.org'
          git add athlete-main-headshot-approved-exact.js index.html
          if git diff --cached --quiet; then echo 'Optical typography refinement already installed.'; exit 0; fi
          git commit -m 'Refine Athlete Main Headshot optical typography'
          git push origin HEAD:main
