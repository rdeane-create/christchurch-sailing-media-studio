name: Finalize AMH Exact Runtime

on:
  push:
    paths:
      - '.github/workflows/finalize-amh-exact-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch exact renderer to use authenticated Studio bridge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('athlete-main-headshot-approved-exact.js')
          t=p.read_text()
          old="function loadImage(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src+'?v='+VERSION;})}"
          new="""const BRIDGE='https://script.google.com/a/macros/christchurchschool.org/s/AKfycbwVpWix_ivzxwpEQxNTBGvJNpThQYjfRRG8T7CYMNPz3r9lB-JI6CowrskoQUAs67lt/exec';\n  async function bridgeJson(params){const url=BRIDGE+'?'+new URLSearchParams(params).toString();const r=await fetch(url,{cache:'no-store',credentials:'include'});if(!r.ok)throw new Error('Studio bridge request failed ('+r.status+').');const d=await r.json();if(!d||d.ok===false)throw new Error((d&&d.error)||'Studio bridge request failed.');return d;}\n  function imageFromData(data,mime){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src='data:'+(mime||'image/webp')+';base64,'+data;});}\n  async function loadImage(src){const name=String(src||'').split('/').pop();const found=await bridgeJson({action:'findfilerecursive',name});const matches=(found.matches||[]);for(const m of matches){try{const payload=await bridgeJson({action:'file',fileId:m.id});if(payload&&payload.data)return await imageFromData(payload.data,'image/webp');}catch(_){}}throw new Error('Exact approved asset unavailable: '+name);}"""
          if old not in t:
              raise SystemExit('Expected loadImage function not found; refusing approximate patch.')
          t=t.replace(old,new,1)
          t=t.replace("const VERSION='20260813-exact-assets-1';","const VERSION='20260813-exact-bridge-2';",1)
          p.write_text(t)
          PY
      - name: Wire Studio only to exact approved renderer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          t=p.read_text()
          pats=[
            r'\s*<script src="athlete-main-headshot-approved-vectors\.js\?v=[^"]+"></script>\s*',
            r'\s*<script src="athlete-main-headshot-approved\.js\?v=[^"]+"></script>\s*',
            r'\s*<script src="athlete-main-headshot-approved-locked-v3\.js\?v=[^"]+"></script>\s*',
            r'\s*<script src="amh-exact-assets-loader\.js\?v=[^"]+"></script>\s*',
            r'\s*<script src="athlete-main-headshot-approved-exact\.js\?v=[^"]+"></script>\s*'
          ]
          for pat in pats:
              t=re.sub(pat,'\n',t)
          marker='<script src="athlete-main-headshot-approved-exact.js?v=20260813-exact-bridge-2"></script>'
          if '</body>' not in t:
              raise SystemExit('Missing </body>')
          t=t.replace('</body>',marker+'\n</body>',1)
          p.write_text(t)
          PY
      - name: Commit final exact Studio wiring
        run: |
          git config user.name 'rdeane-create'
          git config user.email 'rdeane@christchurchschool.org'
          git add athlete-main-headshot-approved-exact.js index.html
          if git diff --cached --quiet; then
            echo 'Already finalized.'
            exit 0
          fi
          git commit -m 'Finalize exact Athlete Main Headshot Studio runtime'
          git push
