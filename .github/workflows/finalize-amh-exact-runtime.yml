# deploy marker: 20260814-visible-metrics-5
name: Finalize AMH Exact Runtime

on:
  push:
    paths:
      - '.github/workflows/finalize-amh-exact-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify exact approved assets and local runtime
        run: |
          test "$(wc -c < assets/Reference/ATHLETE_MAIN_HEADSHOT_APPROVED_LOCKED_OVERLAY_v1.webp)" = "90626"
          test "$(sha256sum assets/Reference/ATHLETE_MAIN_HEADSHOT_APPROVED_LOCKED_OVERLAY_v1.webp | awk '{print $1}')" = "4507debfa0392b50a31a82c1b71b406f4bb841af5e94ae40e761edf56c94bf14"
          test "$(wc -c < assets/Reference/ATHLETE_MAIN_HEADSHOT_APPROVED_GLYPH_ATLAS_v1.webp)" = "323050"
          test "$(sha256sum assets/Reference/ATHLETE_MAIN_HEADSHOT_APPROVED_GLYPH_ATLAS_v1.webp | awk '{print $1}')" = "ab764e51db0ee2d46fbaa1ca3e43d6dc5c18f5cb0e994229566336864dec9b1f"
          ! grep -q "const BRIDGE=" athlete-main-headshot-approved-exact.js
          ! grep -q "bridgeJson" athlete-main-headshot-approved-exact.js
      - name: Install visible-pixel glyph metrics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          r=Path('athlete-main-headshot-approved-exact.js')
          s=r.read_text()

          old_measure="function opticalScale(style,ch){return style==='small'&&(ch==='W'||ch==='V')?.80:1} function measure(text,style,height,tracking){let w=0;for(const ch of String(text||'').toUpperCase()){if(ch===' '){w+=height*.42+tracking;continue}const g=GLYPHS[style+':'+ch];if(!g)continue;const gh=height*opticalScale(style,ch),sc=gh/g.h;w+=g.w*sc+tracking}return Math.max(0,w-tracking)}"
          new_measure="const GLYPH_BOUNDS={}; function visibleGlyph(style,ch){const key=style+':'+ch;if(GLYPH_BOUNDS[key])return GLYPH_BOUNDS[key];const g=GLYPHS[key];if(!g||!S.atlas)return g;const c=document.createElement('canvas');c.width=g.w;c.height=g.h;const gx=c.getContext('2d',{willReadFrequently:true});gx.clearRect(0,0,g.w,g.h);gx.drawImage(S.atlas,g.x,g.y,g.w,g.h,0,0,g.w,g.h);const px=gx.getImageData(0,0,g.w,g.h).data;let minX=g.w,minY=g.h,maxX=-1,maxY=-1;for(let yy=0;yy<g.h;yy++){for(let xx=0;xx<g.w;xx++){if(px[(yy*g.w+xx)*4+3]>16){if(xx<minX)minX=xx;if(xx>maxX)maxX=xx;if(yy<minY)minY=yy;if(yy>maxY)maxY=yy}}}const b=maxX>=minX?{x:g.x+minX,y:g.y+minY,w:maxX-minX+1,h:maxY-minY+1}:g;GLYPH_BOUNDS[key]=b;return b} function measure(text,style,height,tracking){let w=0;const chars=String(text||'').toUpperCase();for(const ch of chars){if(ch===' '){w+=height*.34+tracking;continue}const g=visibleGlyph(style,ch);if(!g)continue;const sc=height/g.h;w+=g.w*sc+tracking}return Math.max(0,w-(chars?tracking:0))}"
          if old_measure in s:
              s=s.replace(old_measure,new_measure,1)
          elif new_measure not in s:
              raise SystemExit('Current optical measure() pattern not found')

          old_draw="function drawRasterText(ctx,text,style,x,y,height,tracking,maxWidth){text=String(text||'').toUpperCase();let h=height,tr=tracking;const mw=measure(text,style,h,tr);if(maxWidth&&mw>maxWidth){const f=maxWidth/mw;h*=f;tr*=f}let cx=x;for(const ch of text){if(ch===' '){cx+=h*.42+tr;continue}const g=GLYPHS[style+':'+ch];if(!g)continue;const gh=h*opticalScale(style,ch),sc=gh/g.h,dw=g.w*sc,dh=gh,gy=y+(h-dh);ctx.save();ctx.shadowColor='rgba(0,0,0,.62)';ctx.shadowBlur=Math.max(4,h*.055);ctx.shadowOffsetX=Math.max(3,h*.035);ctx.shadowOffsetY=Math.max(4,h*.045);ctx.drawImage(S.atlas,g.x,g.y,g.w,g.h,cx,gy,dw,dh);ctx.restore();cx+=dw+tr}}"
          new_draw="function drawRasterText(ctx,text,style,x,y,height,tracking,maxWidth){text=String(text||'').toUpperCase();let h=height,tr=tracking;const mw=measure(text,style,h,tr);if(maxWidth&&mw>maxWidth){const f=maxWidth/mw;h*=f;tr*=f}let cx=x;for(const ch of text){if(ch===' '){cx+=h*.34+tr;continue}const g=visibleGlyph(style,ch);if(!g)continue;const sc=h/g.h,dw=g.w*sc,dh=h;ctx.save();ctx.shadowColor='rgba(0,0,0,.62)';ctx.shadowBlur=Math.max(4,h*.055);ctx.shadowOffsetX=Math.max(3,h*.035);ctx.shadowOffsetY=Math.max(4,h*.045);ctx.drawImage(S.atlas,g.x,g.y,g.w,g.h,cx,y,dw,dh);ctx.restore();cx+=dw+tr}}"
          if old_draw in s:
              s=s.replace(old_draw,new_draw,1)
          elif new_draw not in s:
              raise SystemExit('Current optical drawRasterText() pattern not found')

          # With invisible bitmap padding removed, tracking is now a true fixed visual gap.
          s=s.replace("drawRasterText(ctx,S.first,'small',76,887,58,5,710);","drawRasterText(ctx,S.first,'small',76,887,58,8,710);",1)
          s=s.replace("drawRasterText(ctx,S.last,'large',48,967,205,-28,960);","drawRasterText(ctx,S.last,'large',48,967,205,5,960);",1)

          s=s.replace("const VERSION='20260814-optical-type-4';","const VERSION='20260814-visible-metrics-5';")
          s=s.replace("?v=20260814-optical-type-4","?v=20260814-visible-metrics-5")
          r.write_text(s)

          p=Path('index.html')
          t=p.read_text()
          t,n=re.subn(r'athlete-main-headshot-approved-exact\.js\?v=[^"\']+', 'athlete-main-headshot-approved-exact.js?v=20260814-visible-metrics-5', t)
          if n < 1:
              raise SystemExit('Exact renderer script tag not found in index.html')
          p.write_text(t)

          print('Installed visible-pixel glyph bounds. All letters normalize to the same visible cap height. First gap=8px; surname gap=5px.')
          PY
      - name: Verify typography engine
        run: |
          grep -q "function visibleGlyph" athlete-main-headshot-approved-exact.js
          grep -q "drawRasterText(ctx,S.first,'small',76,887,58,8,710)" athlete-main-headshot-approved-exact.js
          grep -q "drawRasterText(ctx,S.last,'large',48,967,205,5,960)" athlete-main-headshot-approved-exact.js
          ! grep -q "function opticalScale" athlete-main-headshot-approved-exact.js
      - name: Commit visible-pixel typography engine
        run: |
          git config user.name 'rdeane-create'
          git config user.email 'rdeane@christchurchschool.org'
          git add athlete-main-headshot-approved-exact.js index.html
          if git diff --cached --quiet; then echo 'Visible-pixel typography engine already installed.'; exit 0; fi
          git commit -m 'Use visible glyph bounds for consistent Athlete Main Headshot spacing'
          git push origin HEAD:main
