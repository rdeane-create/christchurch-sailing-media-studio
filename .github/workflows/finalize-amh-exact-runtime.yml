# deploy marker: 20260814-generic-optical-11b
name: Finalize AMH Exact Runtime

on:
  push:
    paths:
      - '.github/workflows/finalize-amh-exact-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify exact approved assets and local runtime
        run: |
          test "$(wc -c < assets/Reference/ATHLETE_MAIN_HEADSHOT_APPROVED_LOCKED_OVERLAY_v1.webp)" = "90626"
          test "$(sha256sum assets/Reference/ATHLETE_MAIN_HEADSHOT_APPROVED_LOCKED_OVERLAY_v1.webp | awk '{print $1}')" = "4507debfa0392b50a31a82c1b71b406f4bb841af5e94ae40e761edf56c94bf14"
          test "$(wc -c < assets/Reference/ATHLETE_MAIN_HEADSHOT_APPROVED_GLYPH_ATLAS_v1.webp)" = "323050"
          test "$(sha256sum assets/Reference/ATHLETE_MAIN_HEADSHOT_APPROVED_GLYPH_ATLAS_v1.webp | awk '{print $1}')" = "ab764e51db0ee2d46fbaa1ca3e43d6dc5c18f5cb0e994229566336864dec9b1f"
          ! grep -q "const BRIDGE=" athlete-main-headshot-approved-exact.js
          ! grep -q "bridgeJson" athlete-main-headshot-approved-exact.js
      - name: Install generic optical spacing engine
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, textwrap

          r=Path('athlete-main-headshot-approved-exact.js')
          s=r.read_text()
          start=s.index("  const GLYPH_BOUNDS={};")
          end=s.index("  function drawPhoto(ctx)")
          engine=textwrap.dedent("""\
            const GLYPH_BOUNDS={};
            function visibleGlyph(style,ch){
              const key=style+':'+ch;
              if(GLYPH_BOUNDS[key])return GLYPH_BOUNDS[key];
              const g=GLYPHS[key];
              if(!g||!S.atlas)return g;
              const c=document.createElement('canvas');
              c.width=g.w;c.height=g.h;
              const gx=c.getContext('2d',{willReadFrequently:true});
              gx.clearRect(0,0,g.w,g.h);
              gx.drawImage(S.atlas,g.x,g.y,g.w,g.h,0,0,g.w,g.h);
              const px=gx.getImageData(0,0,g.w,g.h).data;
              let minX=g.w,minY=g.h,maxX=-1,maxY=-1;
              for(let yy=0;yy<g.h;yy++){
                for(let xx=0;xx<g.w;xx++){
                  const i=(yy*g.w+xx)*4,a=px[i+3],bright=Math.max(px[i],px[i+1],px[i+2]);
                  if(a>72&&bright>92){
                    if(xx<minX)minX=xx;if(xx>maxX)maxX=xx;
                    if(yy<minY)minY=yy;if(yy>maxY)maxY=yy;
                  }
                }
              }
              const b=maxX>=minX?{x:g.x+minX,y:g.y+minY,w:maxX-minX+1,h:maxY-minY+1}:g;
              GLYPH_BOUNDS[key]=b;
              return b;
            }
            function opticalGap(style,height,tracking){
              if(style==='large')return Math.max(3,height*.032);
              if(style==='small')return Math.max(4,height*.095);
              return tracking;
            }
            function measure(text,style,height,tracking){
              const chars=String(text||'').toUpperCase();
              const gap=opticalGap(style,height,tracking);
              let w=0,count=0;
              for(const ch of chars){
                if(ch===' '){w+=height*.34;count=0;continue;}
                const g=visibleGlyph(style,ch);if(!g)continue;
                const sc=height/g.h;
                if(count>0)w+=gap;
                w+=g.w*sc;count++;
              }
              return w;
            }
            function drawRasterText(ctx,text,style,x,y,height,tracking,maxWidth){
              text=String(text||'').toUpperCase();
              let h=height;
              const mw=measure(text,style,h,tracking);
              if(maxWidth&&mw>maxWidth)h*=maxWidth/mw;
              const gap=opticalGap(style,h,tracking);
              let cx=x,count=0;
              for(const ch of text){
                if(ch===' '){cx+=h*.34;count=0;continue;}
                const g=visibleGlyph(style,ch);if(!g)continue;
                if(count>0)cx+=gap;
                const sc=h/g.h,dw=g.w*sc,dh=h;
                ctx.save();
                ctx.shadowColor='rgba(0,0,0,.62)';ctx.shadowBlur=Math.max(4,h*.055);
                ctx.shadowOffsetX=Math.max(3,h*.035);ctx.shadowOffsetY=Math.max(4,h*.045);
                ctx.drawImage(S.atlas,g.x,g.y,g.w,g.h,cx,y,dw,dh);
                ctx.restore();
                cx+=dw;count++;
              }
            }
          """)
          s=s[:start]+engine+s[end:]
          s=s.replace("drawRasterText(ctx,S.first,'small',76,887,58,4,710);","drawRasterText(ctx,S.first,'small',76,887,58,0,710);",1)
          s=s.replace("drawRasterText(ctx,S.last,'large',48,967,205,-14,960);","drawRasterText(ctx,S.last,'large',48,967,205,0,960);",1)
          s=re.sub(r"const VERSION='[^']+';","const VERSION='20260814-generic-optical-11';",s,count=1)
          s=re.sub(r"\?v=20260814-[^'\"]+","?v=20260814-generic-optical-11",s)
          r.write_text(s)

          p=Path('index.html')
          t=p.read_text()
          t,n=re.subn(r'athlete-main-headshot-approved-exact\.js\?v=[^"\']+',
                      'athlete-main-headshot-approved-exact.js?v=20260814-generic-optical-11',t)
          if n < 1:
              raise SystemExit('Exact renderer script tag not found in index.html')
          p.write_text(t)
          print('Installed generic bright-ink bounds + fixed optical gap. No per-name kerning or W hacks remain.')
          PY
      - name: Verify generic optical engine
        run: |
          grep -q "bright=Math.max" athlete-main-headshot-approved-exact.js
          grep -q "function opticalGap" athlete-main-headshot-approved-exact.js
          ! grep -q "PAIR_KERN" athlete-main-headshot-approved-exact.js
          ! grep -q "glyphScale" athlete-main-headshot-approved-exact.js
          ! grep -q "glyphOffset" athlete-main-headshot-approved-exact.js
          grep -q "20260814-generic-optical-11" athlete-main-headshot-approved-exact.js
      - name: Commit generic optical engine
        run: |
          git config user.name 'rdeane-create'
          git config user.email 'rdeane@christchurchschool.org'
          git add athlete-main-headshot-approved-exact.js index.html
          if git diff --cached --quiet; then echo 'Generic optical engine already installed.'; exit 0; fi
          git commit -m 'Use generic optical spacing for all athlete names'
          git push origin HEAD:main
