# deploy marker: 20260814-white-core-kern-13
name: Finalize AMH Exact Runtime

on:
  push:
    paths:
      - '.github/workflows/finalize-amh-exact-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify exact approved assets and local runtime
        run: |
          test "$(wc -c < assets/Reference/ATHLETE_MAIN_HEADSHOT_APPROVED_LOCKED_OVERLAY_v1.webp)" = "90626"
          test "$(sha256sum assets/Reference/ATHLETE_MAIN_HEADSHOT_APPROVED_LOCKED_OVERLAY_v1.webp | awk '{print $1}')" = "4507debfa0392b50a31a82c1b71b406f4bb841af5e94ae40e761edf56c94bf14"
          test "$(wc -c < assets/Reference/ATHLETE_MAIN_HEADSHOT_APPROVED_GLYPH_ATLAS_v1.webp)" = "323050"
          test "$(sha256sum assets/Reference/ATHLETE_MAIN_HEADSHOT_APPROVED_GLYPH_ATLAS_v1.webp | awk '{print $1}')" = "ab764e51db0ee2d46fbaa1ca3e43d6dc5c18f5cb0e994229566336864dec9b1f"
          ! grep -q "const BRIDGE=" athlete-main-headshot-approved-exact.js
          ! grep -q "bridgeJson" athlete-main-headshot-approved-exact.js
      - name: Install white-core contour kerning engine
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, textwrap

          r=Path('athlete-main-headshot-approved-exact.js')
          s=r.read_text()
          start=s.index("const GLYPH_METRICS={};")
          end=s.index("  function drawPhoto(ctx)")
          engine=textwrap.dedent("""\
            const GLYPH_METRICS={};
            function glyphMetrics(style,ch){
              const key=style+':'+ch;
              if(GLYPH_METRICS[key])return GLYPH_METRICS[key];
              const g=GLYPHS[key];
              if(!g||!S.atlas)return g;
              const c=document.createElement('canvas');
              c.width=g.w;c.height=g.h;
              const gx=c.getContext('2d',{willReadFrequently:true});
              gx.clearRect(0,0,g.w,g.h);
              gx.drawImage(S.atlas,g.x,g.y,g.w,g.h,0,0,g.w,g.h);
              const px=gx.getImageData(0,0,g.w,g.h).data;
              let minX=g.w,minY=g.h,maxX=-1,maxY=-1;
              const rows=[];
              for(let yy=0;yy<g.h;yy++){
                let left=g.w,right=-1;
                for(let xx=0;xx<g.w;xx++){
                  const i=(yy*g.w+xx)*4;
                  const r=px[i],gg=px[i+1],b=px[i+2],a=px[i+3];
                  const whiteCore=a>170 && Math.min(r,gg,b)>178;
                  if(whiteCore){
                    if(xx<left)left=xx;if(xx>right)right=xx;
                    if(xx<minX)minX=xx;if(xx>maxX)maxX=xx;
                    if(yy<minY)minY=yy;if(yy>maxY)maxY=yy;
                  }
                }
                rows[yy]=right>=left?[left,right]:null;
              }
              if(maxX<minX){GLYPH_METRICS[key]=g;return g;}
              const h=maxY-minY+1,w=maxX-minX+1,left=[],right=[];
              for(let yy=minY;yy<=maxY;yy++){
                const row=rows[yy];
                left.push(row?row[0]-minX:null);
                right.push(row?row[1]-minX:null);
              }
              const m={x:g.x+minX,y:g.y+minY,w,h,left,right};
              GLYPH_METRICS[key]=m;
              return m;
            }
            function glyphWidth(style,ch,height){
              const g=glyphMetrics(style,ch);if(!g)return 0;
              return g.w*(height/g.h);
            }
            function contourDelta(style,a,b,height,tracking){
              if(!a||!b)return 0;
              if(style==='orange')return tracking;
              const A=glyphMetrics(style,a),B=glyphMetrics(style,b);
              if(!A||!B||!A.left||!B.left)return tracking;
              const sa=height/A.h,sb=height/B.h,aw=A.w*sa;
              const target=style==='large'?4:5;
              const needs=[];
              const samples=Math.max(28,Math.round(height));
              for(let n=0;n<samples;n++){
                const t=samples===1?0:n/(samples-1);
                if(t<.06||t>.94)continue;
                const ya=Math.min(A.h-1,Math.round(t*(A.h-1)));
                const yb=Math.min(B.h-1,Math.round(t*(B.h-1)));
                const ar=A.right[ya],bl=B.left[yb];
                if(ar==null||bl==null)continue;
                needs.push(target-aw-bl*sb+ar*sa);
              }
              if(!needs.length)return tracking;
              const required=Math.max(...needs);
              const min=-height*.42,max=style==='large'?height*.08:height*.16;
              return Math.max(min,Math.min(max,required));
            }
            function measure(text,style,height,tracking){
              const chars=String(text||'').toUpperCase();
              let w=0,prev='';
              for(const ch of chars){
                if(ch===' '){w+=height*.34;prev='';continue;}
                const g=glyphMetrics(style,ch);if(!g)continue;
                if(prev)w+=contourDelta(style,prev,ch,height,tracking);
                w+=glyphWidth(style,ch,height);prev=ch;
              }
              return w;
            }
            function drawRasterText(ctx,text,style,x,y,height,tracking,maxWidth){
              text=String(text||'').toUpperCase();
              let h=height;
              const mw=measure(text,style,h,tracking);
              if(maxWidth&&mw>maxWidth)h*=maxWidth/mw;
              let cx=x,prev='';
              for(const ch of text){
                if(ch===' '){cx+=h*.34;prev='';continue;}
                const g=glyphMetrics(style,ch);if(!g)continue;
                if(prev)cx+=contourDelta(style,prev,ch,h,tracking);
                const sc=h/g.h,dw=g.w*sc,dh=h;
                ctx.save();
                ctx.shadowColor='rgba(0,0,0,.62)';ctx.shadowBlur=Math.max(4,h*.055);
                ctx.shadowOffsetX=Math.max(3,h*.035);ctx.shadowOffsetY=Math.max(4,h*.045);
                ctx.drawImage(S.atlas,g.x,g.y,g.w,g.h,cx,y,dw,dh);
                ctx.restore();
                cx+=dw;prev=ch;
              }
            }
          """)
          s=s[:start]+engine+s[end:]
          s=re.sub(r"const VERSION='[^']+';","const VERSION='20260814-white-core-kern-13';",s,count=1)
          s=re.sub(r"\?v=20260814-[^'\"]+","?v=20260814-white-core-kern-13",s)
          r.write_text(s)

          p=Path('index.html')
          t=p.read_text()
          t,n=re.subn(r'athlete-main-headshot-approved-exact\.js\?v=[^"\']+',
                      'athlete-main-headshot-approved-exact.js?v=20260814-white-core-kern-13',t)
          if n < 1:
              raise SystemExit('Exact renderer script tag not found in index.html')
          p.write_text(t)
          print('Installed white-core contour kerning: shadows/bevel ignored; minimum white-to-white gap enforced.')
          PY
      - name: Verify white-core kerning engine
        run: |
          grep -q "whiteCore=a>170" athlete-main-headshot-approved-exact.js
          grep -q "Math.min(r,gg,b)>178" athlete-main-headshot-approved-exact.js
          grep -q "const required=Math.max" athlete-main-headshot-approved-exact.js
          grep -q "const target=style==='large'?4:5" athlete-main-headshot-approved-exact.js
          ! grep -q "PAIR_KERN" athlete-main-headshot-approved-exact.js
          ! grep -q "glyphScale" athlete-main-headshot-approved-exact.js
          ! grep -q "glyphOffset" athlete-main-headshot-approved-exact.js
          grep -q "20260814-white-core-kern-13" athlete-main-headshot-approved-exact.js
      - name: Commit white-core kerning engine
        run: |
          git config user.name 'rdeane-create'
          git config user.email 'rdeane@christchurchschool.org'
          git add athlete-main-headshot-approved-exact.js index.html
          if git diff --cached --quiet; then echo 'White-core kerning engine already installed.'; exit 0; fi
          git commit -m 'Kern athlete names from white letter edges only'
          git push origin HEAD:main
