# deploy marker: 20260814-saved-card-library-17b
name: Finalize AMH Exact Runtime

on:
  push:
    paths:
      - '.github/workflows/finalize-amh-exact-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify locked approved assets
        run: |
          test "$(wc -c < assets/Reference/ATHLETE_MAIN_HEADSHOT_APPROVED_LOCKED_OVERLAY_v1.webp)" = "90626"
          test "$(sha256sum assets/Reference/ATHLETE_MAIN_HEADSHOT_APPROVED_LOCKED_OVERLAY_v1.webp | awk '{print $1}')" = "4507debfa0392b50a31a82c1b71b406f4bb841af5e94ae40e761edf56c94bf14"
          test "$(wc -c < assets/Reference/ATHLETE_MAIN_HEADSHOT_APPROVED_GLYPH_ATLAS_v1.webp)" = "323050"
          test "$(sha256sum assets/Reference/ATHLETE_MAIN_HEADSHOT_APPROVED_GLYPH_ATLAS_v1.webp | awk '{print $1}')" = "ab764e51db0ee2d46fbaa1ca3e43d6dc5c18f5cb0e994229566336864dec9b1f"
      - name: Install saved-card library
        run: python3 .github/scripts/install_saved_card_library.py
      - name: Verify saved-card workflow
        run: |
          grep -q "function suggestedCardName" athlete-main-headshot-approved-exact.js
          grep -q "ATHLETE HEADSHOT CARD" athlete-main-headshot-approved-exact.js
          grep -q "id=\"aSave\"" athlete-main-headshot-approved-exact.js
          grep -q "function saveFinishedCard" athlete-main-headshot-approved-exact.js
          grep -q "ccs-sailing-media-studio-output-library" athlete-main-headshot-approved-exact.js
          grep -q "drawRasterText(ctx,S.first,'small',82,897,58,0,710)" athlete-main-headshot-approved-exact.js
          grep -q "const target=style==='large'?9:7" athlete-main-headshot-approved-exact.js
      - name: Commit saved-card workflow
        run: |
          git config user.name 'rdeane-create'
          git config user.email 'rdeane@christchurchschool.org'
          git add athlete-main-headshot-approved-exact.js index.html
          if git diff --cached --quiet; then echo 'Saved-card workflow already installed.'; exit 0; fi
          git commit -m 'Add Save Card workflow and saved cards library'
          git push origin HEAD:main
