name: Finalize AMH Exact Runtime

on:
  push:
    paths:
      - '.github/workflows/finalize-amh-exact-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify exact approved assets
        run: |
          test "$(wc -c < assets/Reference/ATHLETE_MAIN_HEADSHOT_APPROVED_LOCKED_OVERLAY_v1.webp)" = "90626"
          test "$(sha256sum assets/Reference/ATHLETE_MAIN_HEADSHOT_APPROVED_LOCKED_OVERLAY_v1.webp | awk '{print $1}')" = "4507debfa0392b50a31a82c1b71b406f4bb841af5e94ae40e761edf56c94bf14"
          test "$(wc -c < assets/Reference/ATHLETE_MAIN_HEADSHOT_APPROVED_GLYPH_ATLAS_v1.webp)" = "323050"
          test "$(sha256sum assets/Reference/ATHLETE_MAIN_HEADSHOT_APPROVED_GLYPH_ATLAS_v1.webp | awk '{print $1}')" = "ab764e51db0ee2d46fbaa1ca3e43d6dc5c18f5cb0e994229566336864dec9b1f"
      - name: Switch exact renderer to local-only assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('athlete-main-headshot-approved-exact.js')
          s=p.read_text()
          start=s.index("  const BRIDGE=")
          end=s.index("  function buildCard()", start)
          local="""  function loadImage(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('Exact approved local asset unavailable: '+src));i.src=src+'?v=20260814-exact-local-final';});}\n"""
          s=s[:start]+local+s[end:]
          s=s.replace("const VERSION='20260813-exact-bridge-2';","const VERSION='20260814-exact-local-final';")
          if 'const BRIDGE=' in s or 'bridgeJson' in s or 'findfilerecursive' in s:
              raise SystemExit('bridge code remains')
          if "ATHLETE_MAIN_HEADSHOT_APPROVED_LOCKED_OVERLAY_v1.webp" not in s or "ATHLETE_MAIN_HEADSHOT_APPROVED_GLYPH_ATLAS_v1.webp" not in s:
              raise SystemExit('exact local asset paths missing')
          p.write_text(s)
          PY
      - name: Commit local-only exact runtime
        run: |
          git config user.name 'rdeane-create'
          git config user.email 'rdeane@christchurchschool.org'
          git add athlete-main-headshot-approved-exact.js
          if git diff --cached --quiet; then echo 'Renderer already local-only.'; exit 0; fi
          git commit -m 'Make Athlete Main Headshot exact runtime fully local'
          git push origin HEAD:main
