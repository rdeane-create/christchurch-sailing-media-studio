# deploy marker: 20260814-white-core-balance-15
name: Finalize AMH Exact Runtime

on:
  push:
    paths:
      - '.github/workflows/finalize-amh-exact-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify exact approved assets and local runtime
        run: |
          test "$(wc -c < assets/Reference/ATHLETE_MAIN_HEADSHOT_APPROVED_LOCKED_OVERLAY_v1.webp)" = "90626"
          test "$(sha256sum assets/Reference/ATHLETE_MAIN_HEADSHOT_APPROVED_LOCKED_OVERLAY_v1.webp | awk '{print $1}')" = "4507debfa0392b50a31a82c1b71b406f4bb841af5e94ae40e761edf56c94bf14"
          test "$(wc -c < assets/Reference/ATHLETE_MAIN_HEADSHOT_APPROVED_GLYPH_ATLAS_v1.webp)" = "323050"
          test "$(sha256sum assets/Reference/ATHLETE_MAIN_HEADSHOT_APPROVED_GLYPH_ATLAS_v1.webp | awk '{print $1}')" = "ab764e51db0ee2d46fbaa1ca3e43d6dc5c18f5cb0e994229566336864dec9b1f"
          ! grep -q "const BRIDGE=" athlete-main-headshot-approved-exact.js
          ! grep -q "bridgeJson" athlete-main-headshot-approved-exact.js
      - name: Loosen surname spacing slightly
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          r=Path('athlete-main-headshot-approved-exact.js')
          s=r.read_text()

          old="const target=style==='large'?7:7;"
          new="const target=style==='large'?9:7;"
          if old not in s:
              raise SystemExit('Current balanced spacing target not found')
          s=s.replace(old,new,1)

          s=re.sub(r"const VERSION='[^']+';","const VERSION='20260814-white-core-balance-15';",s,count=1)
          s=re.sub(r"\?v=20260814-[^'\"]+","?v=20260814-white-core-balance-15",s)
          r.write_text(s)

          p=Path('index.html')
          t=p.read_text()
          t,n=re.subn(r'athlete-main-headshot-approved-exact\.js\?v=[^"\']+',
                      'athlete-main-headshot-approved-exact.js?v=20260814-white-core-balance-15',t)
          if n < 1:
              raise SystemExit('Exact renderer script tag not found in index.html')
          p.write_text(t)
          print('Loosened last-name white-core gap by 2px; first-name spacing and all positions unchanged.')
          PY
      - name: Verify surname spacing refinement
        run: |
          grep -q "const target=style==='large'?9:7" athlete-main-headshot-approved-exact.js
          grep -q "drawRasterText(ctx,S.first,'small',76,897,58,0,710)" athlete-main-headshot-approved-exact.js
          grep -q "20260814-white-core-balance-15" athlete-main-headshot-approved-exact.js
          ! grep -q "PAIR_KERN" athlete-main-headshot-approved-exact.js
      - name: Commit surname spacing refinement
        run: |
          git config user.name 'rdeane-create'
          git config user.email 'rdeane@christchurchschool.org'
          git add athlete-main-headshot-approved-exact.js index.html
          if git diff --cached --quiet; then echo 'Surname spacing refinement already installed.'; exit 0; fi
          git commit -m 'Loosen Athlete Main Headshot surname spacing slightly'
          git push origin HEAD:main
