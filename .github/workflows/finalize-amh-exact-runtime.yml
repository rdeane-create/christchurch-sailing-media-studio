# deploy marker: 20260814-pair-kern-10
name: Finalize AMH Exact Runtime

on:
  push:
    paths:
      - '.github/workflows/finalize-amh-exact-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify exact approved assets and local runtime
        run: |
          test "$(wc -c < assets/Reference/ATHLETE_MAIN_HEADSHOT_APPROVED_LOCKED_OVERLAY_v1.webp)" = "90626"
          test "$(sha256sum assets/Reference/ATHLETE_MAIN_HEADSHOT_APPROVED_LOCKED_OVERLAY_v1.webp | awk '{print $1}')" = "4507debfa0392b50a31a82c1b71b406f4bb841af5e94ae40e761edf56c94bf14"
          test "$(wc -c < assets/Reference/ATHLETE_MAIN_HEADSHOT_APPROVED_GLYPH_ATLAS_v1.webp)" = "323050"
          test "$(sha256sum assets/Reference/ATHLETE_MAIN_HEADSHOT_APPROVED_GLYPH_ATLAS_v1.webp | awk '{print $1}')" = "ab764e51db0ee2d46fbaa1ca3e43d6dc5c18f5cb0e994229566336864dec9b1f"
          ! grep -q "const BRIDGE=" athlete-main-headshot-approved-exact.js
          ! grep -q "bridgeJson" athlete-main-headshot-approved-exact.js
      - name: Correct W optical position only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          r=Path('athlete-main-headshot-approved-exact.js')
          s=r.read_text()

          old="function drawRasterText(ctx,text,style,x,y,height,tracking,maxWidth){text=String(text||'').toUpperCase();let h=height,tr=tracking;const mw=measure(text,style,h,tr);if(maxWidth&&mw>maxWidth){const f=maxWidth/mw;h*=f;tr*=f}let cx=x;for(let i=0;i<text.length;i++){const ch=text[i],next=text[i+1]||'';if(ch===' '){cx+=h*.34+tr;continue}const g=visibleGlyph(style,ch);if(!g)continue;const dh=h*glyphScale(style,ch),sc=dh/g.h,dw=g.w*sc,gy=y+(h-dh);ctx.save();ctx.shadowColor='rgba(0,0,0,.62)';ctx.shadowBlur=Math.max(4,h*.055);ctx.shadowOffsetX=Math.max(3,h*.035);ctx.shadowOffsetY=Math.max(4,h*.045);ctx.drawImage(S.atlas,g.x,g.y,g.w,g.h,cx,gy,dw,dh);ctx.restore();cx+=dw+tr+pairKern(style,ch,next)}}"
          new="function glyphOffset(style,ch){return style==='small'&&ch==='W'?{x:4,y:14}:{x:0,y:0}} function drawRasterText(ctx,text,style,x,y,height,tracking,maxWidth){text=String(text||'').toUpperCase();let h=height,tr=tracking;const mw=measure(text,style,h,tr);if(maxWidth&&mw>maxWidth){const f=maxWidth/mw;h*=f;tr*=f}let cx=x;for(let i=0;i<text.length;i++){const ch=text[i],next=text[i+1]||'';if(ch===' '){cx+=h*.34+tr;continue}const g=visibleGlyph(style,ch);if(!g)continue;const o=glyphOffset(style,ch),dh=h*glyphScale(style,ch),sc=dh/g.h,dw=g.w*sc,gy=y+(h-dh)+o.y;ctx.save();ctx.shadowColor='rgba(0,0,0,.62)';ctx.shadowBlur=Math.max(4,h*.055);ctx.shadowOffsetX=Math.max(3,h*.035);ctx.shadowOffsetY=Math.max(4,h*.045);ctx.drawImage(S.atlas,g.x,g.y,g.w,g.h,cx+o.x,gy,dw,dh);ctx.restore();cx+=dw+tr+pairKern(style,ch,next)}}"
          if old not in s:
              raise SystemExit('Current drawRasterText pattern not found')
          s=s.replace(old,new,1)
          s=s.replace("const VERSION='20260814-pair-kern-9';","const VERSION='20260814-pair-kern-10';",1)
          s=s.replace("?v=20260814-pair-kern-9","?v=20260814-pair-kern-10")
          r.write_text(s)

          p=Path('index.html')
          t=p.read_text()
          t,n=re.subn(r'athlete-main-headshot-approved-exact\.js\?v=[^"\']+',
                      'athlete-main-headshot-approved-exact.js?v=20260814-pair-kern-10',t)
          if n < 1:
              raise SystemExit('Exact renderer script tag not found in index.html')
          p.write_text(t)
          print('W optical offset: +4px x, +14px y; all other typography unchanged.')
          PY
      - name: Verify W position correction
        run: |
          grep -q "function glyphOffset" athlete-main-headshot-approved-exact.js
          grep -q "ch==='W'?{x:4,y:14}" athlete-main-headshot-approved-exact.js
          grep -q "20260814-pair-kern-10" athlete-main-headshot-approved-exact.js
      - name: Commit W position correction
        run: |
          git config user.name 'rdeane-create'
          git config user.email 'rdeane@christchurchschool.org'
          git add athlete-main-headshot-approved-exact.js index.html
          if git diff --cached --quiet; then echo 'W position correction already installed.'; exit 0; fi
          git commit -m 'Correct Athlete Main Headshot W optical position'
          git push origin HEAD:main
