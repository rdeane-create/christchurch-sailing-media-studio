name: Install Regatta Results Story v21 Vertical Header Stretch
on:
  push:
    paths:
      - '.github/workflows/install-regatta-results-story-v21-vertical-header-stretch.yml'
      - '.github/scripts/install_regatta_results_story_v21_vertical_header_stretch.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record protected template hashes
        run: |
          sha256sum athlete-main-headshot-approved-exact.js > /tmp/main.before
          sha256sum college-acceptance.js > /tmp/college.before
          sha256sum csms-template-recovery-v1.js > /tmp/welcome.before
      - name: Stretch header vertically only
        run: python .github/scripts/install_regatta_results_story_v21_vertical_header_stretch.py
      - name: Validate isolated header stretch
        run: |
          python - <<'PY'
          from pathlib import Path
          js=Path('regatta-results-story.js').read_text()
          assert 'REGATTA RESULTS STORY — BUILD v21' in js
          assert '20260815-regatta-results-story-v21-vertical-header-stretch' in js
          assert 'HEADER_W=1080,HEADER_H=270' in js
          assert 'ctx.drawImage(headerImg,0,0,SRC_W,SRC_H,0,0,HEADER_W,HEADER_H)' in js
          assert 'const leftY=1370,rightY=1185' in js
          print('v21 isolated vertical header stretch validated')
          PY
          sha256sum athlete-main-headshot-approved-exact.js > /tmp/main.after
          sha256sum college-acceptance.js > /tmp/college.after
          sha256sum csms-template-recovery-v1.js > /tmp/welcome.after
          diff -u /tmp/main.before /tmp/main.after
          diff -u /tmp/college.before /tmp/college.after
          diff -u /tmp/welcome.before /tmp/welcome.after
      - name: Commit Studio install
        run: |
          git config user.name "rdeane-create"
          git config user.email "rdeane@christchurchschool.org"
          git add regatta-results-story.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Stretch Regatta Results header vertically"
          git push
