name: Install Lineup Headshot Blue Fade v2

on:
  push:
    paths:
      - '.github/scripts/install_lineup_headshot_blue_fade_v2.py'
      - '.github/workflows/install-lineup-headshot-blue-fade-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply blue fade
        run: python3 .github/scripts/install_lineup_headshot_blue_fade_v2.py
      - name: Validate blue fade
        run: |
          grep -F "CSMS_LINEUP_HEADSHOT_BLUE_FADE_V2" lineup-headshot.js
          grep -F "const fadeTop=885;" lineup-headshot.js
          grep -F "lineup-headshot-v2-blue-fade" index.html
      - name: Commit Lineup Headshot blue fade
        run: |
          git config user.name 'rdeane-create'
          git config user.email 'rdeane@christchurchschool.org'
          git add lineup-headshot.js index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add blue fade to Lineup Headshot'
          git push
