name: Inspect Lineup Headshot Base

on:
  push:
    paths:
      - '.github/scripts/inspect_lineup_headshot_base.py'
      - '.github/workflows/inspect-lineup-headshot-base.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/inspect_lineup_headshot_base.py
