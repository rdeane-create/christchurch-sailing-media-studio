name: Fix header fade overlap
on:
  push:
    paths:
      - '.github/workflows/temp-fix-header-fade-overlap.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix fade overlap only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('regatta-results-story.js')
          s=p.read_text()
          old="  ctx.fillRect(0,SOLID_H,W,FADE_H);"
          new="  ctx.fillRect(0,SOLID_H-18,W,FADE_H+18);"
          if old not in s:
              raise SystemExit('Fade fillRect target not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit fade overlap fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add regatta-results-story.js
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Regatta Results header fade overlap'
          git push
