name: Install Regatta Results Story v18 Exact Athlete Header
on:
  push:
    paths:
      - '.github/workflows/install-regatta-results-story-v18-exact-athlete-header.yml'
      - '.github/scripts/install_regatta_results_story_v18_exact_athlete_header.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record protected template hashes
        run: |
          sha256sum athlete-main-headshot-approved-exact.js > /tmp/main.before
          sha256sum college-acceptance.js > /tmp/college.before
          sha256sum csms-template-recovery-v1.js > /tmp/welcome.before
      - name: Install exact Athlete Main header
        run: python .github/scripts/install_regatta_results_story_v18_exact_athlete_header.py
      - name: Validate isolated exact-header fix
        run: |
          python - <<'PY'
          from pathlib import Path
          js=Path('regatta-results-story.js').read_text()
          assert 'REGATTA RESULTS STORY — BUILD v18' in js
          assert '20260815-regatta-results-story-v18-exact-athlete-header' in js
          assert 'ctx.drawImage(approvedMainOverlay,0,0,1080,1350)' in js
          assert 'const leftY=1370,rightY=1185' in js
          cover=js[js.index('function drawCover(ctx){'):js.index('\nfunction drawScore(ctx){')]
          assert 'drawAthleteMainExactStage(ctx);drawCoverBand(ctx);' in cover
          assert 'drawLockedHeroHeaderContract(ctx)' not in cover
          print('Regatta Results v18 exact Athlete Main header validated')
          PY
          sha256sum athlete-main-headshot-approved-exact.js > /tmp/main.after
          sha256sum college-acceptance.js > /tmp/college.after
          sha256sum csms-template-recovery-v1.js > /tmp/welcome.after
          diff -u /tmp/main.before /tmp/main.after
          diff -u /tmp/college.before /tmp/college.after
          diff -u /tmp/welcome.before /tmp/welcome.after
      - name: Commit Studio install
        run: |
          git config user.name "rdeane-create"
          git config user.email "rdeane@christchurchschool.org"
          git add regatta-results-story.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Use exact Athlete Main header pixels in Regatta Results"
          git push
