name: Smooth header fade
on:
  push:
    paths:
      - '.github/workflows/temp-smooth-header-fade.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smooth header fade only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('regatta-results-story.js')
          s=p.read_text()
          old="""  const SOLID_H=LOGO_Y+DST_H,FADE_H=110;\n"""
          new="""  const SOLID_H=LOGO_Y+DST_H,FADE_H=190;\n"""
          if old not in s:
              raise SystemExit('Fade height line not found')
          s=s.replace(old,new,1)
          old2="""  const fade=ctx.createLinearGradient(0,SOLID_H,0,SOLID_H+FADE_H);\n  fade.addColorStop(0,'rgba(238,241,244,1)');\n  fade.addColorStop(.35,'rgba(238,241,244,.92)');\n  fade.addColorStop(.7,'rgba(238,241,244,.45)');\n  fade.addColorStop(1,'rgba(238,241,244,0)');\n"""
          new2="""  const fade=ctx.createLinearGradient(0,SOLID_H-18,0,SOLID_H+FADE_H);\n  fade.addColorStop(0,'rgba(238,241,244,.88)');\n  fade.addColorStop(.18,'rgba(238,241,244,.78)');\n  fade.addColorStop(.42,'rgba(238,241,244,.56)');\n  fade.addColorStop(.68,'rgba(238,241,244,.28)');\n  fade.addColorStop(.86,'rgba(238,241,244,.10)');\n  fade.addColorStop(1,'rgba(238,241,244,0)');\n"""
          if old2 not in s:
              raise SystemExit('Fade block not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Commit fade adjustment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add regatta-results-story.js
          git diff --cached --quiet && exit 0
          git commit -m 'Smooth Regatta Results header fade'
          git push
# trigger
