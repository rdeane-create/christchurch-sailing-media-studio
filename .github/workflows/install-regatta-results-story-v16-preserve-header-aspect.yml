name: Install Regatta Results Story v16 Preserve Header Aspect
on:
  push:
    paths:
      - '.github/workflows/install-regatta-results-story-v16-preserve-header-aspect.yml'
      - '.github/scripts/install_regatta_results_story_v16_preserve_header_aspect.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record protected template hashes
        run: |
          sha256sum athlete-main-headshot-approved-exact.js > /tmp/main.before
          sha256sum college-acceptance.js > /tmp/college.before
          sha256sum csms-template-recovery-v1.js > /tmp/welcome.before
      - name: Install aspect-preserved approved header
        run: python .github/scripts/install_regatta_results_story_v16_preserve_header_aspect.py
      - name: Validate isolated header scaling fix
        run: |
          python - <<'PY'
          from pathlib import Path
          js=Path('regatta-results-story.js').read_text()
          assert 'REGATTA RESULTS STORY — BUILD v16' in js
          assert '20260815-regatta-results-story-v16-preserve-header-aspect' in js
          assert 'CHRISTCHURCH_HERO_CARD_MASTER_v1_APPROVED.png' in js
          assert 'const srcW=1023,srcH=218,dstH=209,dstW=srcW*(dstH/srcH),dstX=(1080-dstW)/2' in js
          assert 'ctx.drawImage(headerImg,0,0,srcW,srcH,dstX,0,dstW,dstH)' in js
          assert 'const leftY=1370,rightY=1185' in js
          cover=js[js.index('function drawCover(ctx){'):js.index('\nfunction drawScore(ctx){')]
          assert 'drawAthleteMainExactStage(ctx);drawLockedHeroHeaderContract(ctx);drawCoverBand(ctx);' in cover
          print('Regatta Results v16 header aspect ratio validated')
          PY
          sha256sum athlete-main-headshot-approved-exact.js > /tmp/main.after
          sha256sum college-acceptance.js > /tmp/college.after
          sha256sum csms-template-recovery-v1.js > /tmp/welcome.after
          diff -u /tmp/main.before /tmp/main.after
          diff -u /tmp/college.before /tmp/college.after
          diff -u /tmp/welcome.before /tmp/welcome.after
      - name: Commit Studio install
        run: |
          git config user.name "rdeane-create"
          git config user.email "rdeane@christchurchschool.org"
          git add regatta-results-story.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Preserve approved header aspect ratio in Regatta Results"
          git push
