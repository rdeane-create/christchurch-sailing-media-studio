name: Install Regatta Results Story v25 Fixed Banner
on:
  push:
    paths:
      - '.github/workflows/install-regatta-results-story-v24-banner-over-photo.yml'
      - '.github/scripts/rrs_v25.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install fixed banner overlay
        run: python .github/scripts/rrs_v25.py
      - name: Validate fixed banner behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          js=Path('regatta-results-story.js').read_text()
          assert 'REGATTA RESULTS STORY — BUILD v25' in js
          assert "ctx.fillStyle='#eef1f4';ctx.fillRect(0,0,W,270);" in js
          assert "ctx.createLinearGradient(0,270,0,352)" in js
          assert "drawAthleteMainExactStage(ctx);drawFadeBridge(ctx);drawCoverBand(ctx);drawFinalHeader(ctx);" in js
          print('Regatta Results v25 fixed banner validated')
          PY
      - name: Commit Studio install
        run: |
          git config user.name "rdeane-create"
          git config user.email "rdeane@christchurchschool.org"
          git add regatta-results-story.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Make Regatta Results banner fixed full-width overlay"
          git push
