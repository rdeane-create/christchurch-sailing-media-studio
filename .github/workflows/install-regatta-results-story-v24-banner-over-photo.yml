name: Install Regatta Results Story v24 Banner Over Photo
on:
  push:
    paths:
      - '.github/workflows/install-regatta-results-story-v24-banner-over-photo.yml'
      - '.github/scripts/install_regatta_results_story_v24_banner_overlay_photo.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install banner-over-photo rendering
        run: python .github/scripts/install_regatta_results_story_v24_banner_overlay_photo.py
      - name: Validate isolated cover behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          js=Path('regatta-results-story.js').read_text()
          assert 'REGATTA RESULTS STORY — BUILD v24' in js
          assert "drawAthleteMainExactStage(ctx);drawFadeBridge(ctx);drawCoverBand(ctx);drawFinalHeader(ctx);" in js
          assert 'Photo fills the full stage behind the banner' in js
          assert "if(coverPhoto){drawAthleteMainExactPhoto(ctx,coverPhoto)}" in js
          print('Regatta Results v24 banner-over-photo behavior validated')
          PY
      - name: Commit Studio install
        run: |
          git config user.name "rdeane-create"
          git config user.email "rdeane@christchurchschool.org"
          git add regatta-results-story.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Keep Regatta Results banner over full-stage photo"
          git push
