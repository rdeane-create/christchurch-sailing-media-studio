name: Install Exact Athlete Main Headshot

on:
  push:
    paths:
      - 'athlete-main-headshot-approved-exact.js'
      - '.github/scripts/install_saved_card_library.py'
      - '.github/workflows/install-athlete-main-headshot-approved.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preserve exact approved renderer wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          t=p.read_text()
          patterns=[
            r'\s*<script src="athlete-main-headshot-approved-vectors\.js\?v=[^"]+"></script>\s*',
            r'\s*<script src="athlete-main-headshot-approved\.js\?v=[^"]+"></script>\s*',
            r'\s*<script src="athlete-main-headshot-approved-locked-v3\.js\?v=[^"]+"></script>\s*',
            r'\s*<script src="athlete-main-headshot-approved-exact\.js\?v=[^"]+"></script>\s*',
          ]
          for pat in patterns:
              t=re.sub(pat,'\n',t)
          marker='<script src="athlete-main-headshot-approved-exact.js?v=20260813-exact-1"></script>'
          if '</body>' not in t:
              raise SystemExit('Missing </body>')
          t=t.replace('</body>',marker+'\n</body>',1)
          p.write_text(t)
          PY

      - name: Install Drive-backed Saved Cards
        run: python3 .github/scripts/install_saved_card_library.py

      - name: Validate Drive-backed Saved Cards
        run: |
          grep -q 'CSMS DRIVE-BACKED SAVED CARDS V1' athlete-main-headshot-approved-exact.js
          grep -q "savedCardBridgeCall('saveCard'" athlete-main-headshot-approved-exact.js
          grep -q "savedCardBridgeCall('listSavedCards'" athlete-main-headshot-approved-exact.js
          grep -q "savedCardBridgeCall('getSavedCard'" athlete-main-headshot-approved-exact.js
          grep -q "savedCardBridgeCall('deleteSavedCard'" athlete-main-headshot-approved-exact.js
          grep -q '20260814-drive-saved-cards-19' index.html

      - name: Commit Drive-backed Saved Cards wiring
        run: |
          git config user.name 'rdeane-create'
          git config user.email 'rdeane@christchurchschool.org'
          git add index.html athlete-main-headshot-approved-exact.js
          if git diff --cached --quiet; then
            echo 'Drive-backed Saved Cards already installed.'
            exit 0
          fi
          git commit -m 'Install responsive Drive-backed Saved Cards'
          git push
