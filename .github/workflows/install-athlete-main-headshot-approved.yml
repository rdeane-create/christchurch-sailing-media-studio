name: Install Athlete Main Headshot Approved Template

on:
  push:
    paths:
      - 'athlete-main-headshot-approved-locked-v3.js'
      - 'athlete-main-headshot-approved-vectors.js'
      - '.github/workflows/install-athlete-main-headshot-approved.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install locked approved template loaders
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          t=p.read_text()
          patterns=[
            r'\s*<script src="athlete-main-headshot-approved-vectors\.js\?v=[^"]+"></script>\s*',
            r'\s*<script src="athlete-main-headshot-approved\.js\?v=[^"]+"></script>\s*',
            r'\s*<script src="athlete-main-headshot-approved-locked-v3\.js\?v=[^"]+"></script>\s*'
          ]
          for pat in patterns:
              t=re.sub(pat,'\n',t)
          markers=[
            '<script src="athlete-main-headshot-approved-vectors.js?v=20260813-3"></script>',
            '<script src="athlete-main-headshot-approved-locked-v3.js?v=20260813-3"></script>'
          ]
          if '</body>' not in t:
              raise SystemExit('Missing </body>')
          t=t.replace('</body>', '\n'.join(markers)+'\n</body>', 1)
          p.write_text(t)
          PY
      - name: Commit install
        run: |
          git config user.name 'rdeane-create'
          git config user.email 'rdeane@christchurchschool.org'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Use locked assets for Athlete Main Headshot Approved'
          git push
