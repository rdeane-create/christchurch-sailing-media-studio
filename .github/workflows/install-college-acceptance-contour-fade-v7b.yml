name: Install College Acceptance Stray Mark Cleanup v10
on:
  push:
    paths:
      - '.github/scripts/remove_college_acceptance_stray_mark_v10.py'
      - '.github/workflows/install-college-acceptance-contour-fade-v7b.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record locked Main Headshot hash
        run: sha256sum athlete-main-headshot-approved-exact.js | tee /tmp/main_before.sha
      - name: Apply College Acceptance v10 stray-mark cleanup
        run: python3 .github/scripts/remove_college_acceptance_stray_mark_v10.py
      - name: Validate locked Main Headshot and College Acceptance
        run: |
          sha256sum athlete-main-headshot-approved-exact.js | tee /tmp/main_after.sha
          diff /tmp/main_before.sha /tmp/main_after.sha
          grep -q "college-acceptance-v10-stray-mark-cleanup" college-acceptance.js
          grep -q "lowerRight=cx>iw\*.76&&cy>ih\*.64" college-acceptance.js
          grep -q "nameGap=62" college-acceptance.js
          grep -q "prepareLogoDisplay" college-acceptance.js
      - name: Commit College Acceptance change
        run: |
          git config user.name "rdeane-create"
          git config user.email "rdeane@christchurchschool.org"
          git add college-acceptance.js
          git commit -m "Remove stray mark from College Acceptance logo" || exit 0
          git push
