name: Install College Acceptance JPEG Knockout v9
on:
  push:
    paths:
      - '.github/scripts/install_college_acceptance_jpeg_knockout_v9.py'
      - '.github/workflows/install-college-acceptance-contour-fade-v7b.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record locked Main Headshot hash
        run: sha256sum athlete-main-headshot-approved-exact.js | tee /tmp/main_before.sha
      - name: Apply College Acceptance v9 JPEG knockout
        run: python3 .github/scripts/install_college_acceptance_jpeg_knockout_v9.py
      - name: Validate locked Main Headshot and College Acceptance
        run: |
          sha256sum athlete-main-headshot-approved-exact.js | tee /tmp/main_after.sha
          diff /tmp/main_before.sha /tmp/main_after.sha
          grep -q "college-acceptance-v9-jpeg-knockout" college-acceptance.js
          grep -q "prepareLogoDisplay" college-acceptance.js
          grep -q "S.logoDisplay" college-acceptance.js
          grep -q "nameGap=62" college-acceptance.js
          ! grep -q "ctx.drawImage(S.logo,-aw/2" college-acceptance.js
      - name: Commit College Acceptance change
        run: |
          git config user.name "rdeane-create"
          git config user.email "rdeane@christchurchschool.org"
          git add college-acceptance.js
          git commit -m "Remove JPEG box from College Acceptance logo display" || exit 0
          git push
