name: Restore Regatta Results banner horizontal
on:
  push:
    paths:
      - '.github/workflows/temp-restore-horizontal-banner.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove banner rotation only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('regatta-results-story.js')
          s=p.read_text()
          old="  ctx.translate(SOLID_H+FADE_H,0);\n  ctx.rotate(Math.PI/2);\n"
          if old not in s:
              raise SystemExit('Rotation lines not found')
          p.write_text(s.replace(old,'',1))
          PY
      - name: Commit rotation removal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add regatta-results-story.js
          git diff --cached --quiet && exit 0
          git commit -m 'Restore Regatta Results banner horizontal'
          git push
