name: Extend Regatta Results banner gray to card edges

on:
  push:
    paths:
      - '.github/workflows/fix-regatta-banner-gray-edge-v29.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match edge fill to banner gray
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('regatta-results-story.js')
          s = p.read_text()
          old = "const BANNER_BG='#eef1f4';"
          new = "const BANNER_BG='#f2f2f1';"
          if old not in s:
              raise SystemExit('Expected banner gray not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit single visual change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add regatta-results-story.js
          git diff --cached --quiet && exit 0
          git commit -m 'Match Regatta Results banner gray to full card width'
          git push
