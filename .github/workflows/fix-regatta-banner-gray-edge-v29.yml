name: Rotate Regatta Results logo banner 90 degrees clockwise

on:
  push:
    paths:
      - '.github/workflows/fix-regatta-banner-gray-edge-v29.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rotate the entire logo banner 90 degrees clockwise
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('regatta-results-story.js')
          s = p.read_text()
          old = "  const BANNER_BG='#f2f2f1';\n  ctx.save();\n  // Extend the existing gray banner background to both card edges."
          new = "  const BANNER_BG='#f2f2f1';\n  ctx.save();\n  ctx.translate(SOLID_H+FADE_H,0);\n  ctx.rotate(Math.PI/2);\n  // Extend the existing gray banner background to both card edges."
          if old not in s:
              raise SystemExit('Expected logo banner draw block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit single banner rotation test
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add regatta-results-story.js
          git diff --cached --quiet && exit 0
          git commit -m 'Rotate Regatta Results logo banner 90 degrees clockwise'
          git push
