name: Extend Regatta Results logo banner to card edges

on:
  push:
    paths:
      - '.github/workflows/fix-regatta-banner-gray-edge-v29.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extend the logo banner itself to full card width
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('regatta-results-story.js')
          s = p.read_text()
          old = "const DST_W=1004,DST_H=251,DST_X=(W-DST_W)/2,DST_Y=0;"
          new = "const DST_W=W,DST_H=251,DST_X=0,DST_Y=0;"
          if old not in s:
              raise SystemExit('Expected logo banner sizing line not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit single banner change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add regatta-results-story.js
          git diff --cached --quiet && exit 0
          git commit -m 'Extend Regatta Results logo banner to card edges'
          git push
