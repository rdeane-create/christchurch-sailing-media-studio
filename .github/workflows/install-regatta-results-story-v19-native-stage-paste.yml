name: Install Regatta Results Story v19 Native Stage Paste
on:
  push:
    paths:
      - '.github/workflows/install-regatta-results-story-v19-native-stage-paste.yml'
      - '.github/scripts/install_regatta_results_story_v19_native_stage_paste.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record protected template hashes
        run: |
          sha256sum athlete-main-headshot-approved-exact.js > /tmp/main.before
          sha256sum college-acceptance.js > /tmp/college.before
          sha256sum csms-template-recovery-v1.js > /tmp/welcome.before
      - name: Install native 1 to 1 Athlete stage
        run: python .github/scripts/install_regatta_results_story_v19_native_stage_paste.py
      - name: Validate native stage paste
        run: |
          python - <<'PY'
          from pathlib import Path
          js=Path('regatta-results-story.js').read_text()
          assert 'REGATTA RESULTS STORY — BUILD v19' in js
          assert '20260815-regatta-results-story-v19-native-stage-paste' in js
          assert 'stage.width=1080;stage.height=1350' in js
          assert 'sctx.drawImage(approvedMainOverlay,0,0)' in js
          assert 'ctx.drawImage(athleteStage,0,0)' in js
          assert 'ctx.drawImage(athleteStage,0,0,' not in js
          assert 'const leftY=1370,rightY=1185' in js
          print('Regatta Results v19 native stage paste validated')
          PY
          sha256sum athlete-main-headshot-approved-exact.js > /tmp/main.after
          sha256sum college-acceptance.js > /tmp/college.after
          sha256sum csms-template-recovery-v1.js > /tmp/welcome.after
          diff -u /tmp/main.before /tmp/main.after
          diff -u /tmp/college.before /tmp/college.after
          diff -u /tmp/welcome.before /tmp/welcome.after
      - name: Commit Studio install
        run: |
          git config user.name "rdeane-create"
          git config user.email "rdeane@christchurchschool.org"
          git add regatta-results-story.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Paste Athlete Main stage at native size in Regatta Results"
          git push
# v19 native-stage trigger
