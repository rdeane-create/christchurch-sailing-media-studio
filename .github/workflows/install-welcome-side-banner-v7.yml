name: Install Welcome Aboard Clean Edge Blue Fade v20
on:
  push:
    paths:
      - '.github/workflows/install-welcome-side-banner-v7.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record locked hashes
        run: |
          sha256sum athlete-main-headshot-approved-exact.js > /tmp/main.before
          sha256sum college-acceptance.js > /tmp/college.before
      - name: Install clean edge and blue fade
        run: python .github/scripts/install_welcome_side_banner_v7.py
      - name: Validate scoped iteration and locked files
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('csms-template-recovery-v1.js').read_text()
          block=s[s.index('function drawWelcomeOverlay'):s.index('function drawWelcomeCard')]
          assert "20260815-welcome-athlete-main-drive-v20-clean-edge-blue-fade" in s
          assert "const featherW=82;" in block
          assert "const outside=10;" in block
          assert "const edgeMask=lx.createLinearGradient(" in block
          assert "grad.addColorStop(.82,'#f4511e')" in block
          assert "grad.addColorStop(1,'#17304d')" in block
          assert "const topY=600;" in block
          assert "const leftTop=840+slide;" in block
          assert "const leftBottom=735+slide;" in block
          assert "photoFade.addColorStop(.38,'rgba(0,0,0,1)')" in block
          assert "ctx.fillText('WELCOME',midX,1004)" in block
          assert "ctx.fillText('ABOARD',midX,1094)" in block
          assert "ctx.fillRect(midX-54,1157,108,4)" in block
          assert "const rail=" not in block
          print('Verified scoped iteration: seam removed, words remain in orange, smooth navy fade added; all other Welcome Aboard geometry and type preserved')
          PY
          sha256sum athlete-main-headshot-approved-exact.js > /tmp/main.after
          sha256sum college-acceptance.js > /tmp/college.after
          diff -u /tmp/main.before /tmp/main.after
          diff -u /tmp/college.before /tmp/college.after
      - name: Commit refinement
        run: |
          git config user.name "rdeane-create"
          git config user.email "rdeane@christchurchschool.org"
          git add csms-template-recovery-v1.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remove Welcome Aboard edge seam and add blue fade"
          git push
