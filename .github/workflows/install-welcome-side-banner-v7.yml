name: Install Welcome Aboard Faded Side Banner v9
on:
  push:
    paths:
      - '.github/workflows/install-welcome-side-banner-v7.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record locked hashes
        run: |
          sha256sum athlete-main-headshot-approved-exact.js > /tmp/main.before
          sha256sum college-acceptance.js > /tmp/college.before
      - name: Install faded editorial side banner
        run: python .github/scripts/install_welcome_side_banner_v7.py
      - name: Validate faded banner and locked files
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('csms-template-recovery-v1.js').read_text()
          assert "20260815-welcome-athlete-main-drive-v9-faded-side-banner" in s
          assert "ctx.fillText('WELCOME',midX,908)" in s
          assert "ctx.fillText('ABOARD',midX,997)" in s
          assert "globalCompositeOperation='destination-in'" in s
          assert "ctx.translate(midX-27,810)" not in s
          print('Verified moved type, removed flag, and installed banner-to-photo fade')
          PY
          sha256sum athlete-main-headshot-approved-exact.js > /tmp/main.after
          sha256sum college-acceptance.js > /tmp/college.after
          diff -u /tmp/main.before /tmp/main.after
          diff -u /tmp/college.before /tmp/college.after
      - name: Commit refinement
        run: |
          git config user.name "rdeane-create"
          git config user.email "rdeane@christchurchschool.org"
          git add csms-template-recovery-v1.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refine Welcome Aboard banner fade and type placement"
          git push
