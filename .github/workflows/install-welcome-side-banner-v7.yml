name: Install Welcome Aboard Editorial Side Banner v8
on:
  push:
    paths:
      - '.github/workflows/install-welcome-side-banner-v7.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record locked hashes
        run: |
          sha256sum athlete-main-headshot-approved-exact.js > /tmp/main.before
          sha256sum college-acceptance.js > /tmp/college.before
      - name: Install editorial side banner
        run: python .github/scripts/install_welcome_side_banner_v7.py
      - name: Validate actual side banner renderer and locked files
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('csms-template-recovery-v1.js').read_text()
          assert "20260815-welcome-athlete-main-drive-v8-editorial-side-banner" in s
          assert "const topX=808+slide,bottomX=625+slide,rightX=1080+slide" in s
          assert "ctx.fillText('WELCOME',midX,566)" in s
          assert "ctx.fillText('ABOARD',midX,665)" in s
          assert "const finalX=620,finalY=790" not in s
          print('Verified full-height editorial side banner renderer is installed')
          PY
          sha256sum athlete-main-headshot-approved-exact.js > /tmp/main.after
          sha256sum college-acceptance.js > /tmp/college.after
          diff -u /tmp/main.before /tmp/main.after
          diff -u /tmp/college.before /tmp/college.after
      - name: Commit side banner
        run: |
          git config user.name "rdeane-create"
          git config user.email "rdeane@christchurchschool.org"
          git add csms-template-recovery-v1.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Install full-height Welcome Aboard editorial banner"
          git push
