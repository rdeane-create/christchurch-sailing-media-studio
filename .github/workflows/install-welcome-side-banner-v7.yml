name: Install Welcome Aboard Photo Fade Wedge v13
on:
  push:
    paths:
      - '.github/workflows/install-welcome-side-banner-v7.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record locked hashes
        run: |
          sha256sum athlete-main-headshot-approved-exact.js > /tmp/main.before
          sha256sum college-acceptance.js > /tmp/college.before
      - name: Install photo-fade lower-right wedge
        run: python .github/scripts/install_welcome_side_banner_v7.py
      - name: Validate wedge refinement and locked files
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('csms-template-recovery-v1.js').read_text()
          block=s[s.index('function drawWelcomeOverlay'):s.index('function drawWelcomeCard')]
          assert "20260815-welcome-athlete-main-drive-v13-photo-fade-wedge" in s
          assert "const photoFade=lx.createLinearGradient(0,topY,0,790)" in block
          assert "photoFade.addColorStop(0,'rgba(0,0,0,0)')" in block
          assert "grad.addColorStop(.94,'#7a3540')" in block
          assert "ctx.fillText('WELCOME',midX,982)" in block
          assert "ctx.fillText('ABOARD',midX,1072)" in block
          assert "rgba(255,255,255,.98)" not in block
          assert "ctx.translate(midX-27,810)" not in block
          print('Verified lower type, photo fade at top, smoother orange/navy blend, and no flag')
          PY
          sha256sum athlete-main-headshot-approved-exact.js > /tmp/main.after
          sha256sum college-acceptance.js > /tmp/college.after
          diff -u /tmp/main.before /tmp/main.after
          diff -u /tmp/college.before /tmp/college.after
      - name: Commit refinement
        run: |
          git config user.name "rdeane-create"
          git config user.email "rdeane@christchurchschool.org"
          git add csms-template-recovery-v1.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refine Welcome Aboard photo fade and lower type"
          git push
