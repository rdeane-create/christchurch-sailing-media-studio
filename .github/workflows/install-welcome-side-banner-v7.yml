name: Install Welcome Aboard Editorial Side Banner v7
on:
  push:
    paths:
      - '.github/workflows/install-welcome-side-banner-v7.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record locked hashes
        run: |
          sha256sum athlete-main-headshot-approved-exact.js > /tmp/main.before
          sha256sum college-acceptance.js > /tmp/college.before
      - name: Install editorial side banner
        run: python .github/scripts/install_welcome_side_banner_v7.py
      - name: Validate side banner and locked files
        run: |
          grep -Fq "20260815-welcome-athlete-main-drive-v7-editorial-side-banner" csms-template-recovery-v1.js
          grep -Fq "const topX=808+slide,bottomX=625+slide,rightX=1080+slide" csms-template-recovery-v1.js
          grep -Fq "ctx.fillText('WELCOME',midX,566)" csms-template-recovery-v1.js
          grep -Fq "ctx.fillText('ABOARD',midX,665)" csms-template-recovery-v1.js
          sha256sum athlete-main-headshot-approved-exact.js > /tmp/main.after
          sha256sum college-acceptance.js > /tmp/college.after
          diff -u /tmp/main.before /tmp/main.after
          diff -u /tmp/college.before /tmp/college.after
      - name: Commit side banner
        run: |
          git config user.name "rdeane-create"
          git config user.email "rdeane@christchurchschool.org"
          git add csms-template-recovery-v1.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Use editorial side banner in Welcome Aboard"
          git push
