name: Install Welcome Aboard Wide White Fade Wedge v12
on:
  push:
    paths:
      - '.github/workflows/install-welcome-side-banner-v7.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record locked hashes
        run: |
          sha256sum athlete-main-headshot-approved-exact.js > /tmp/main.before
          sha256sum college-acceptance.js > /tmp/college.before
      - name: Install wider lower-right wedge
        run: python .github/scripts/install_welcome_side_banner_v7.py
      - name: Validate wedge geometry and locked files
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('csms-template-recovery-v1.js').read_text()
          block=s[s.index('function drawWelcomeOverlay'):s.index('function drawWelcomeCard')]
          assert "20260815-welcome-athlete-main-drive-v12-wide-white-fade-wedge" in s
          assert "const topY=600" in block
          assert "const leftTop=840+slide" in block
          assert "const leftBottom=735+slide" in block
          assert "grad.addColorStop(0,'rgba(255,255,255,.98)')" in block
          assert "grad.addColorStop(.43,'#f4511e')" in block
          assert "ctx.fillText('WELCOME',midX,908)" in block
          assert "ctx.fillText('ABOARD',midX,997)" in block
          assert "ctx.translate(midX-27,810)" not in block
          print('Verified wider wedge, white-to-orange top fade, protected name safe zone, and no flag')
          PY
          sha256sum athlete-main-headshot-approved-exact.js > /tmp/main.after
          sha256sum college-acceptance.js > /tmp/college.after
          diff -u /tmp/main.before /tmp/main.after
          diff -u /tmp/college.before /tmp/college.after
      - name: Commit refinement
        run: |
          git config user.name "rdeane-create"
          git config user.email "rdeane@christchurchschool.org"
          git add csms-template-recovery-v1.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Widen Welcome Aboard wedge and fade top to white"
          git push
