name: Install Regatta Results Story v22 Final Header Fade
on:
  push:
    paths:
      - '.github/workflows/install-regatta-results-story-v22-final-header-fade.yml'
      - '.github/scripts/install_regatta_results_story_v22_final_header_fade.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record protected template hashes
        run: |
          sha256sum athlete-main-headshot-approved-exact.js > /tmp/main.before
          sha256sum college-acceptance.js > /tmp/college.before
          sha256sum csms-template-recovery-v1.js > /tmp/welcome.before
      - name: Install final header and fade polish
        run: python .github/scripts/install_regatta_results_story_v22_final_header_fade.py
      - name: Validate isolated v22 polish
        run: |
          python - <<'PY'
          from pathlib import Path
          js=Path('regatta-results-story.js').read_text()
          assert 'REGATTA RESULTS STORY — BUILD v22' in js
          assert 'DST_W=1004,DST_H=251' in js
          assert 'drawFinalHeader(ctx);drawFadeBridge(ctx);drawCoverBand(ctx);' in js
          assert 'const leftY=1370,rightY=1185' in js
          assert "g.addColorStop(1,'rgba(6,41,90,.92)')" in js
          print('Regatta Results v22 final header/fade polish validated')
          PY
          sha256sum athlete-main-headshot-approved-exact.js > /tmp/main.after
          sha256sum college-acceptance.js > /tmp/college.after
          sha256sum csms-template-recovery-v1.js > /tmp/welcome.after
          diff -u /tmp/main.before /tmp/main.after
          diff -u /tmp/college.before /tmp/college.after
          diff -u /tmp/welcome.before /tmp/welcome.after
      - name: Commit Studio install
        run: |
          git config user.name "rdeane-create"
          git config user.email "rdeane@christchurchschool.org"
          git add regatta-results-story.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Polish Regatta Results header scale and fade"
          git push
