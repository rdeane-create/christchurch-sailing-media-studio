name: Install Regatta Results Story v1
on:
  push:
    paths:
      - '.github/workflows/install-regatta-results-story-v1.yml'
      - '.github/scripts/install_regatta_results_story_v1.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record locked hashes
        run: |
          sha256sum athlete-main-headshot-approved-exact.js > /tmp/main.before
          sha256sum college-acceptance.js > /tmp/college.before
          sha256sum csms-template-recovery-v1.js > /tmp/welcome.before
      - name: Install Regatta Results Story
        run: python .github/scripts/install_regatta_results_story_v1.py
      - name: Validate isolated install
        run: |
          python - <<'PY'
          from pathlib import Path
          idx=Path('index.html').read_text()
          js=Path('regatta-results-story.js').read_text()
          assert '<script src="regatta-results-story.js?v=20260815-v1"></script>' in idx
          assert 'REGATTA RESULTS STORY — BUILD v6' in js
          assert '20260815-regatta-results-story-v6-native-overlay-broad-diagonal' in js
          assert 'ATHLETE_MAIN_HEADSHOT_APPROVED_LOCKED_OVERLAY_v1.webp' in js
          assert 'ctx.drawImage(approvedMainOverlay,0,0,1080,1350)' in js
          assert 'function drawCoverBand' in js
          assert 'ctx.moveTo(0,1490);ctx.lineTo(W,1010)' in js
          assert 'ctx.lineTo(430,H)' in js
          assert 'id="rrsCoverScale"' in js
          assert 'id="rrsCoverX"' in js
          assert 'id="rrsCoverY"' in js
          assert 'id="rrsCoverOpacity"' in js
          cover=js[js.index('function drawCover(ctx){'):js.index('\nfunction drawScore(ctx){')]
          assert 'footer(ctx' not in cover
          print('Regatta Results Story v6 native overlay/broad diagonal validated')
          PY
          sha256sum athlete-main-headshot-approved-exact.js > /tmp/main.after
          sha256sum college-acceptance.js > /tmp/college.after
          sha256sum csms-template-recovery-v1.js > /tmp/welcome.after
          diff -u /tmp/main.before /tmp/main.after
          diff -u /tmp/college.before /tmp/college.after
          diff -u /tmp/welcome.before /tmp/welcome.after
      - name: Commit Studio install
        run: |
          git config user.name "rdeane-create"
          git config user.email "rdeane@christchurchschool.org"
          git add index.html regatta-results-story.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Broaden Regatta Results panel and use native approved overlay"
          git push
