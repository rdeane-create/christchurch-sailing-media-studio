name: Patch Hero visual fidelity

on:
  push:
    paths:
      - '.github/workflows/patch-hero-visual-fidelity.yml'
      - '.github/scripts/patch_hero_visual.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-hero:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Hero Builder
        run: python3 .github/scripts/patch_hero_visual.py

      - name: Commit Studio code
        run: |
          git config user.name "rdeane-create"
          git config user.email "rdeane@christchurchschool.org"
          git add index.html
          if git diff --cached --quiet; then
            echo "No Studio change produced."
            exit 0
          fi
          git commit -m "Apply locked Hero visual fidelity in Studio"
          git push
