name: Install College Acceptance Contour Fade v7

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/install-college-acceptance-contour-fade-v7.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Record locked Main Headshot hash
        run: |
          LOCKED=$(grep -RIl "Athlete Main Headshot — Approved\|Athlete Main Headshot" . | head -n 1)
          if [ -z "$LOCKED" ]; then
            echo "Locked Main Headshot template not found" >&2
            exit 1
          fi
          sha256sum "$LOCKED" > /tmp/locked-main-headshot.sha

      - name: Apply College Acceptance contour fade refinement
        shell: python
        run: |
          import pathlib, re, sys
          target = None
          for path in pathlib.Path('.').rglob('*'):
              if not path.is_file():
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except Exception:
                  continue
              if "const NAME='College Acceptance';" in text:
                  target = path
                  break
          if not target:
              print('College Acceptance template not found', file=sys.stderr)
              sys.exit(1)
          text = target.read_text(encoding='utf-8')

          text = text.replace("const VERSION='20260815-college-acceptance-v5-floating-cutout';","const VERSION='20260815-college-acceptance-v7-contour-fade-gap';")
          text = text.replace("const S={cards:[],base:null,logo:null,logoTrim:null,progress:1,anim:0,renderUrl:null,shoulderY:560};","const S={cards:[],base:null,logo:null,logoTrim:null,logoBacking:null,progress:1,anim:0,renderUrl:null,shoulderY:560};")

          trim_replacement = r"""function trimLogo(img){const iw=img.naturalWidth||img.width||1,ih=img.naturalHeight||img.height||1;const src=document.createElement('canvas');src.width=iw;src.height=ih;const c=src.getContext('2d',{willReadFrequently:true});c.drawImage(img,0,0,iw,ih);let id;try{id=c.getImageData(0,0,iw,ih);}catch(_){return src;}const d=id.data,seen=new Uint8Array(iw*ih),q=[],isBg=(x,y)=>{const i=(y*iw+x)*4,r=d[i],g=d[i+1],b=d[i+2],a=d[i+3];return a<18||(r>242&&g>242&&b>242&&Math.max(r,g,b)-Math.min(r,g,b)<12);};const push=(x,y)=>{if(x<0||y<0||x>=iw||y>=ih)return;const k=y*iw+x;if(seen[k]||!isBg(x,y))return;seen[k]=1;q.push(k);};for(let x=0;x<iw;x++){push(x,0);push(x,ih-1);}for(let y=0;y<ih;y++){push(0,y);push(iw-1,y);}for(let qi=0;qi<q.length;qi++){const k=q[qi],x=k%iw,y=(k/iw)|0;push(x+1,y);push(x-1,y);push(x,y+1);push(x,y-1);}for(let k=0;k<seen.length;k++)if(seen[k])d[k*4+3]=0;c.putImageData(id,0,0);let l=iw,r=-1,t=ih,b=-1;for(let y=0;y<ih;y++)for(let x=0;x<iw;x++){const a=d[(y*iw+x)*4+3];if(a>12){if(x<l)l=x;if(x>r)r=x;if(y<t)t=y;if(y>b)b=y;}}if(r<l||b<t)return src;const pad=2;l=Math.max(0,l-pad);t=Math.max(0,t-pad);r=Math.min(iw-1,r+pad);b=Math.min(ih-1,b+pad);const w=r-l+1,h=b-t+1,out=document.createElement('canvas');out.width=w;out.height=h;const oc=out.getContext('2d',{willReadFrequently:true});oc.drawImage(src,l,t,w,h,0,0,w,h);try{const oid=oc.getImageData(0,0,w,h),dd=oid.data,visited=new Uint8Array(w*h),parts=[];for(let yy=0;yy<h;yy++)for(let xx=0;xx<w;xx++){const start=yy*w+xx;if(visited[start]||dd[start*4+3]<=18)continue;const queue=[start],pixels=[];visited[start]=1;while(queue.length){const cur=queue.pop();pixels.push(cur);const cx=cur%w,cy=(cur/w)|0;const neigh=[[cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]];for(const [nx,ny] of neigh){if(nx<0||ny<0||nx>=w||ny>=h)continue;const nk=ny*w+nx;if(visited[nk]||dd[nk*4+3]<=18)continue;visited[nk]=1;queue.push(nk);}}parts.push({pixels,area:pixels.length});}if(parts.length>1){parts.sort((a,b)=>b.area-a.area);const largest=parts[0].area;const keep=new Uint8Array(w*h);parts.forEach((part,i)=>{if(i<5&&part.area>=Math.max(42,largest*.015))part.pixels.forEach(k=>keep[k]=1);});for(let k=0;k<keep.length;k++)if(!keep[k])dd[k*4+3]=0;oc.putImageData(oid,0,0);}}catch(_){;}return out;}
function makeWhiteBacking(img){const w=img.width||img.naturalWidth||1,h=img.height||img.naturalHeight||1,cv=document.createElement('canvas');cv.width=w;cv.height=h;const cx=cv.getContext('2d');cx.drawImage(img,0,0,w,h);cx.globalCompositeOperation='source-in';cx.fillStyle='#fff';cx.fillRect(0,0,w,h);cx.globalCompositeOperation='source-over';return cv;}
function loadLogo(file){if(!file){S.logo=S.logoTrim=S.logoBacking=null;draw();return;}const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{S.logo=im;S.logoTrim=trimLogo(im);S.logoBacking=makeWhiteBacking(S.logoTrim||im);S.progress=1;draw();q('caStatus').textContent='College logo loaded. Play the drop animation.';setTimeout(()=>URL.revokeObjectURL(u),60000);};im.onerror=()=>{URL.revokeObjectURL(u);q('caStatus').textContent='Could not load that logo file.';};im.src=u;}"""
          text, n = re.subn(r"function trimLogo\(img\)\{.*?\nfunction loadLogo\(file\)\{.*?\}\nfunction rounded", trim_replacement + "\nfunction rounded", text, flags=re.S)
          if n != 1:
              print('Could not replace trim/loadLogo block', file=sys.stderr)
              sys.exit(1)

          draw_replacement = r"""function drawLogo(ctx,p=1){if(!S.logo)return;const t=Math.max(0,Math.min(1,p)),e=1-Math.pow(1-t,3);const art=S.logoTrim||S.logo,backing=S.logoBacking||makeWhiteBacking(art),iw=art.width||art.naturalWidth||1,ih=art.height||art.naturalHeight||1;const nameTop=920,nameGap=34,targetBottom=nameTop-nameGap,shoulderTop=Math.max(500,Math.min(690,(S.shoulderY||560)+18)),faceGap=18,availableH=Math.max(90,targetBottom-shoulderTop-faceGap),maxArtW=990,maxArtH=Math.max(60,availableH),sc=Math.min(maxArtW/iw,maxArtH/ih),aw=iw*sc,ah=ih*sc,bw=aw+28,bh=ah+28,finalY=targetBottom-ah/2,startY=95,x=540,y=startY+(finalY-startY)*e;ctx.save();ctx.translate(x,y);ctx.save();ctx.globalAlpha=.28;ctx.shadowColor='rgba(255,255,255,1)';ctx.shadowBlur=58;ctx.drawImage(backing,-bw/2,-bh/2,bw,bh);ctx.restore();ctx.save();ctx.globalAlpha=.52;ctx.shadowColor='rgba(255,255,255,.98)';ctx.shadowBlur=28;ctx.drawImage(backing,-bw/2,-bh/2,bw,bh);ctx.restore();ctx.save();ctx.globalAlpha=.92;ctx.filter='blur(1.2px)';ctx.drawImage(backing,-bw/2,-bh/2,bw,bh);ctx.restore();ctx.save();ctx.shadowColor='rgba(0,10,28,.32)';ctx.shadowBlur=14;ctx.shadowOffsetY=6;ctx.drawImage(art,-aw/2,-ah/2,aw,ah);ctx.restore();ctx.drawImage(art,-aw/2,-ah/2,aw,ah);ctx.restore();}
function draw"""
          text, n = re.subn(r"function drawLogo\(ctx,p=1\)\{.*?\}\nfunction draw", draw_replacement, text, flags=re.S)
          if n != 1:
              print('Could not replace drawLogo block', file=sys.stderr)
              sys.exit(1)

          text = text.replace("A tight white contour backing and soft halo are generated behind the original logo.","A fading white contour backing and soft halo are generated behind the original logo.")
          target.write_text(text, encoding='utf-8')
          print(target)

      - name: Validate locked Main Headshot and College Acceptance
        run: |
          sha256sum --check /tmp/locked-main-headshot.sha
          TARGET=$(grep -RIl "const NAME='College Acceptance';" . | head -n 1)
          grep -q "logoBacking:null" "$TARGET"
          grep -q "fading white contour backing" "$TARGET"
          grep -q "nameGap=34" "$TARGET"

      - name: Commit College Acceptance contour fade refinement
        run: |
          if git diff --quiet; then
            echo "No changes made" >&2
            exit 1
          fi
          git config user.name "rdeane-create"
          git config user.email "rdeane@christchurchschool.org"
          git add -A
          git commit -m "Refine College Acceptance contour fade and spacing"
          git push
