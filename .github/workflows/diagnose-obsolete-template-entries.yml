name: Diagnose obsolete template entries
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diagnose-obsolete-template-entries.yml'
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find obsolete template entries
        run: |
          echo '--- COLLEGE ANNOUNCEMENT MASTER (REPO-WIDE) ---'
          grep -RIn -C 6 --exclude-dir=.git -F 'COLLEGE ANNOUNCEMENT' . || true
          echo '--- CHRISTCHURCH HERO CARD MASTER (REPO-WIDE) ---'
          grep -RIn -C 6 --exclude-dir=.git -F 'CHRISTCHURCH HERO CARD' . || true
          echo '--- TEMPLATE DELETE HELPERS ---'
          grep -n -C 3 -E 'media(Delete|Remove)|deleteTemplate|mediaGetAll|ensureDefaultTemplates' index.html | head -160 || true
          echo '--- ATHLETE MAIN HEADSHOT HASH (DO NOT CHANGE) ---'
          sha256sum athlete-main-headshot-approved-exact.js
