name: Diagnose obsolete template entries
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diagnose-obsolete-template-entries.yml'
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find obsolete template entries
        run: |
          echo '--- HERO DEFAULT REFERENCES ---'
          grep -n -C 8 -F 'defaultTemplateHeroCard' index.html || true
          grep -n -C 8 -F 'HERO_CARD_TEMPLATE_ID' index.html || true
          echo '--- TEMPLATE LIBRARY RANGE ---'
          sed -n '5240,5335p' index.html
          echo '--- ATHLETE MAIN HEADSHOT HASH (DO NOT CHANGE) ---'
          sha256sum athlete-main-headshot-approved-exact.js
