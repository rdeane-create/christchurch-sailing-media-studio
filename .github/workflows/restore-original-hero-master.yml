name: Restore untouched original Hero master

on:
  push:
    paths:
      - '.github/workflows/restore-original-hero-master.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download exact approved master through existing Studio bridge
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, pathlib, struct, urllib.parse, urllib.request

          bridge='https://script.google.com/a/macros/christchurchschool.org/s/AKfycbwVpWix_ivzxwpEQxNTBGvJNpThQYjfRRG8T7CYMNPz3r9lB-JI6CowrskoQUAs67lt/exec'
          drive_file_id='1lqiQnm2XyEZFR4bhA6WyUYGaQ96HWRVO'
          expected_sha='ade1907e4d610e0f08967c51476b97eada1c7bc188876299d957a75d953c7086'
          expected_dims=(1023,1537)

          url=bridge+'?'+urllib.parse.urlencode({'action':'file','fileId':drive_file_id})
          req=urllib.request.Request(url,headers={'User-Agent':'CSMS-Exact-Master-Restore/1.0'})
          with urllib.request.urlopen(req,timeout=120) as r:
              payload=json.loads(r.read().decode('utf-8'))
          if not payload.get('ok') or not payload.get('data'):
              raise SystemExit('Bridge did not return the original master file')

          raw=base64.b64decode(payload['data'])
          if not raw.startswith(b'\x89PNG\r\n\x1a\n'):
              raise SystemExit('Returned file is not a PNG')
          dims=struct.unpack('>II',raw[16:24])
          if dims!=expected_dims:
              raise SystemExit(f'Wrong dimensions: {dims}, expected {expected_dims}')
          digest=hashlib.sha256(raw).hexdigest()
          if digest!=expected_sha:
              raise SystemExit(f'Wrong SHA-256: {digest}')

          out=pathlib.Path('assets/OriginalMasters/CHRISTCHURCH_HERO_CARD_MASTER_v1_APPROVED.png')
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_bytes(raw)
          print(f'PASS exact original master: {len(raw)} bytes {dims[0]}x{dims[1]} sha256={digest}')
          PY

      - name: Commit untouched original master
        shell: bash
        run: |
          git config user.name 'rdeane-create'
          git config user.email 'rdeane@christchurchschool.org'
          git add assets/OriginalMasters/CHRISTCHURCH_HERO_CARD_MASTER_v1_APPROVED.png
          if git diff --cached --quiet; then
            echo 'Exact original master already present.'
            exit 0
          fi
          git commit -m 'Add untouched original Hero master PNG'
          git push
