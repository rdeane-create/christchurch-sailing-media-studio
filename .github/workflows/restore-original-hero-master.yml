name: Restore untouched original Hero master

on:
  push:
    paths:
      - '.github/workflows/restore-original-hero-master.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download exact approved master directly
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/OriginalMasters
          curl -L --fail --silent --show-error \
            'https://lh3.googleusercontent.com/d/1lqiQnm2XyEZFR4bhA6WyUYGaQ96HWRVO' \
            -o assets/OriginalMasters/CHRISTCHURCH_HERO_CARD_MASTER_v1_APPROVED.png

          python3 - <<'PY'
          import hashlib, pathlib, struct
          p=pathlib.Path('assets/OriginalMasters/CHRISTCHURCH_HERO_CARD_MASTER_v1_APPROVED.png')
          raw=p.read_bytes()
          if not raw.startswith(b'\x89PNG\r\n\x1a\n'):
              raise SystemExit('Downloaded file is not PNG')
          dims=struct.unpack('>II',raw[16:24])
          if dims!=(1023,1537):
              raise SystemExit(f'Wrong dimensions: {dims}')
          digest=hashlib.sha256(raw).hexdigest()
          expected='ade1907e4d610e0f08967c51476b97eada1c7bc188876299d957a75d953c7086'
          if digest!=expected:
              raise SystemExit(f'Wrong SHA-256: {digest}')
          if len(raw)!=2783107:
              raise SystemExit(f'Wrong file size: {len(raw)}')
          print(f'PASS exact untouched master: {len(raw)} bytes {dims[0]}x{dims[1]} sha256={digest}')
          PY

      - name: Commit untouched original master
        shell: bash
        run: |
          git config user.name 'rdeane-create'
          git config user.email 'rdeane@christchurchschool.org'
          git add assets/OriginalMasters/CHRISTCHURCH_HERO_CARD_MASTER_v1_APPROVED.png
          if git diff --cached --quiet; then
            echo 'Exact original master already present.'
            exit 0
          fi
          git commit -m 'Add untouched original Hero master PNG'
          git push
