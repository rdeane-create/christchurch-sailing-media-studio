name: Restore exact RC5 Hero assets from repository recovery data

on:
  push:
    paths:
      - '.github/workflows/restore-hero-footer-from-bridge.yml'

permissions:
  contents: write

jobs:
  restore-hero-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install image verifier
        run: python3 -m pip install --quiet pillow

      - name: Reconstruct and verify locked RC5 assets
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, io, pathlib, re, zlib
          from PIL import Image

          ROOT=pathlib.Path('.')
          OUT=ROOT/'assets'/'Reference'
          OUT.mkdir(parents=True,exist_ok=True)

          HEADER_PIXEL_SHA='64f19bb679cb5948702198f4e58bea8752740592b39d385d7003a10aeabe6d8f'
          FOOTER_FILE_SHA='43e4e717e30cc151960d8aeb7e01dd3ee6150001b411f095a7240aac3237eeba'
          FOOTER_PIXEL_SHA='bf18bf9bf12fe46871b36b583d1bc063fbef67784a6182ea31d0930166bfa916'

          def payload_runs(path):
              text=pathlib.Path(path).read_text(errors='ignore')
              runs=re.findall(r'[A-Za-z0-9+/=]{64,}',text)
              if not runs:
                  raise RuntimeError(f'No base64 payload in {path}')
              return runs

          def decode_b64_join(paths):
              pieces=[]
              for p in paths:
                  pieces.extend(payload_runs(p))
              s=''.join(pieces)
              if 'UklGR' in s:
                  s=s[s.index('UklGR'):]
              s += '='*((4-len(s)%4)%4)
              return base64.b64decode(s)

          def pixel_sha(raw):
              im=Image.open(io.BytesIO(raw)).convert('RGBA')
              return im.size, hashlib.sha256(im.tobytes()).hexdigest(), im

          header_paths=['hero-approved-header-1.js','hero-approved-header-2.js','hero-approved-header-3.js']
          header_raw=decode_b64_join(header_paths)
          print('Header assembled bytes:',len(header_raw),'magic:',header_raw[:12])
          hsize,hpix,himg=pixel_sha(header_raw)
          if hsize!=(1023,218):
              raise SystemExit(f'Header dimensions mismatch: {hsize}')
          if hpix!=HEADER_PIXEL_SHA:
              raise SystemExit(f'Header pixel checksum mismatch: {hpix}')

          master=Image.new('RGBA',(1023,1537),(0,0,0,0))
          master.paste(himg,(0,0))
          master_path=OUT/'CHRISTCHURCH_HERO_CARD_MASTER_v1_APPROVED.png'
          master.save(master_path,'PNG',optimize=True)
          check=Image.open(master_path).convert('RGBA').crop((0,0,1023,218))
          check_sha=hashlib.sha256(check.tobytes()).hexdigest()
          if check_sha!=HEADER_PIXEL_SHA:
              raise SystemExit(f'Reconstructed master header mismatch: {check_sha}')
          print('VERIFIED locked header:',hsize,hpix,'->',master_path,master_path.stat().st_size,'bytes')

          candidates=[
              ['hero-approved-footer-1.txt','.recovery/footer.exact.part2'],
              ['.recovery/footer.part1','.recovery/footer.exact.part2'],
              ['.recovery/footer.part1','.recovery/footer.part2'],
              ['hero-approved-footer-1.txt','.recovery/footer.part2'],
              ['.recovery/footer.part2'],
          ]
          accepted=None
          diagnostics=[]
          for paths in candidates:
              try:
                  raw=decode_b64_join(paths)
                  variants=[('direct',raw)]
                  for label,fn in [('gzip',gzip.decompress),('zlib',zlib.decompress)]:
                      try: variants.append((label,fn(raw)))
                      except Exception: pass
                  for label,data in variants:
                      digest=hashlib.sha256(data).hexdigest()
                      try:
                          size,pix,_=pixel_sha(data)
                      except Exception:
                          diagnostics.append((paths,label,len(data),digest,'not-image',data[:12]))
                          continue
                      diagnostics.append((paths,label,len(data),digest,size,pix))
                      if digest==FOOTER_FILE_SHA and size==(1080,1350) and pix==FOOTER_PIXEL_SHA:
                          accepted=data
                          break
                  if accepted is not None: break
              except Exception as exc:
                  diagnostics.append((paths,'error',str(exc)))

          if accepted is None:
              print('Footer recovery diagnostics:')
              for row in diagnostics: print(row)
              raise SystemExit('No repository recovery combination matched the exact RC5 footer checksums.')

          footer_path=OUT/'HERO_FOOTER_OVERLAY_v1.png'
          footer_path.write_bytes(accepted)
          print('VERIFIED locked footer:',footer_path,len(accepted),'bytes',FOOTER_FILE_SHA)
          PY

      - name: Commit verified native RC5 assets
        shell: bash
        run: |
          git config user.name 'rdeane-create'
          git config user.email 'rdeane@christchurchschool.org'
          git add assets/Reference/CHRISTCHURCH_HERO_CARD_MASTER_v1_APPROVED.png assets/Reference/HERO_FOOTER_OVERLAY_v1.png
          if git diff --cached --quiet; then
            echo 'Verified RC5 assets already present.'
            exit 0
          fi
          git commit -m 'Restore verified native RC5 Hero locked assets'
          git push
