name: Restore Hero footer from Studio bridge

on:
  push:
    paths:
      - '.github/workflows/restore-hero-footer-from-bridge.yml'

permissions:
  contents: write

jobs:
  restore-footer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Recover exact footer from Drive through existing read-only bridge
        shell: bash
        env:
          BRIDGE: https://script.google.com/a/macros/christchurchschool.org/s/AKfycbwVpWix_ivzxwpEQxNTBGvJNpThQYjfRRG8T7CYMNPz3r9lB-JI6CowrskoQUAs67lt/exec
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, struct, urllib.parse, urllib.request

          bridge = os.environ['BRIDGE']
          filename = 'HERO_FOOTER_OVERLAY_v1.png'

          def get_json(params):
              url = bridge + '?' + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={'User-Agent':'CSMS-Recovery/1.0'})
              with urllib.request.urlopen(req, timeout=90) as r:
                  body = r.read()
                  ctype = r.headers.get('content-type','')
              try:
                  return json.loads(body.decode('utf-8'))
              except Exception:
                  raise SystemExit(f'Bridge did not return JSON ({ctype}); first bytes={body[:160]!r}')

          found = get_json({'action':'findfilerecursive','name':filename})
          if not found.get('ok'):
              raise SystemExit('Bridge lookup failed: '+json.dumps(found)[:1000])
          matches = found.get('matches') or []
          print('matches:', json.dumps(matches, indent=2))
          if not matches:
              raise SystemExit('Original HERO_FOOTER_OVERLAY_v1.png was not found in Drive')

          # Prefer paths that look like original Studio/reference/package locations.
          def rank(m):
              p=(m.get('path') or '').lower()
              score=0
              if 'assets' in p: score+=10
              if 'reference' in p: score+=10
              if 'permanent' in p: score+=5
              if 'studio' in p: score+=2
              return score
          match=sorted(matches,key=rank,reverse=True)[0]
          payload=get_json({'action':'file','fileId':match['id']})
          if not payload.get('ok') or not payload.get('data'):
              raise SystemExit('Bridge file payload failed: '+json.dumps(payload)[:1000])
          raw=base64.b64decode(payload['data'])
          if not raw.startswith(b'\x89PNG\r\n\x1a\n'):
              raise SystemExit('Recovered footer is not PNG')
          w,h=struct.unpack('>II',raw[16:24])
          if (w,h)!=(1080,1350):
              raise SystemExit(f'Unexpected footer dimensions {w}x{h}')
          out=pathlib.Path('assets/Reference/HERO_FOOTER_OVERLAY_v1.png')
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_bytes(raw)
          print(f'Restored {out}: {len(raw)} bytes, {w}x{h}, Drive file {match["id"]}, path={match.get("path")}')
          PY

      - name: Commit exact recovered footer
        shell: bash
        run: |
          git config user.name 'rdeane-create'
          git config user.email 'rdeane@christchurchschool.org'
          git add assets/Reference/HERO_FOOTER_OVERLAY_v1.png
          if git diff --cached --quiet; then
            echo 'Footer already matches repository.'
            exit 0
          fi
          git commit -m 'Restore original approved Hero footer from Studio Drive source'
          git push
