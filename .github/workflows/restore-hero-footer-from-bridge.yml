name: Build native RC5 Hero locked assets from approved uploads

on:
  push:
    paths:
      - '.github/workflows/restore-hero-footer-from-bridge.yml'

permissions:
  contents: write

jobs:
  build-hero-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install image verifier
        run: python3 -m pip install --quiet pillow

      - name: Build exact header-only master and verify footer
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, pathlib
          from PIL import Image

          root = pathlib.Path('assets/Reference')
          src_master = root / 'CHRISTCHURCH_HERO_CARD_MASTER_v1_APPROVED(1).png'
          dst_master = root / 'CHRISTCHURCH_HERO_CARD_MASTER_v1_APPROVED.png'
          footer = root / 'HERO_FOOTER_OVERLAY_v1.png'

          EXPECTED_MASTER_FILE_SHA = 'ade1907e4d610e0f08967c51476b97eada1c7bc188876299d957a75d953c7086'
          EXPECTED_HEADER_PIXEL_SHA = '64f19bb679cb5948702198f4e58bea8752740592b39d385d7003a10aeabe6d8f'
          EXPECTED_FOOTER_FILE_SHA = '43e4e717e30cc151960d8aeb7e01dd3ee6150001b411f095a7240aac3237eeba'
          EXPECTED_FOOTER_PIXEL_SHA = 'bf18bf9bf12fe46871b36b583d1bc063fbef67784a6182ea31d0930166bfa916'

          def file_sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          if not src_master.exists():
              raise SystemExit(f'Missing approved uploaded master: {src_master}')
          if file_sha(src_master) != EXPECTED_MASTER_FILE_SHA:
              raise SystemExit(f'Approved master file checksum mismatch: {file_sha(src_master)}')

          approved = Image.open(src_master).convert('RGBA')
          if approved.size != (1023, 1537):
              raise SystemExit(f'Approved master dimensions mismatch: {approved.size}')

          header = approved.crop((0, 0, 1023, 218))
          header_pixel_sha = hashlib.sha256(header.tobytes()).hexdigest()
          if header_pixel_sha != EXPECTED_HEADER_PIXEL_SHA:
              raise SystemExit(f'Approved header pixel checksum mismatch: {header_pixel_sha}')

          # RC5 production master is a locked header source only. Everything below
          # the exact approved 218px header is transparent so the editable athlete
          # photo, name, year, and footer can render exactly once.
          native = Image.new('RGBA', (1023, 1537), (0, 0, 0, 0))
          native.paste(header, (0, 0))
          native.save(dst_master, 'PNG', optimize=True)

          verify = Image.open(dst_master).convert('RGBA')
          if verify.size != (1023, 1537):
              raise SystemExit(f'Native master dimensions mismatch: {verify.size}')
          verify_header = verify.crop((0, 0, 1023, 218))
          if hashlib.sha256(verify_header.tobytes()).hexdigest() != EXPECTED_HEADER_PIXEL_SHA:
              raise SystemExit('Native master header changed during write.')
          if any(px[3] for px in verify.crop((0, 218, 1023, 1537)).getdata()):
              raise SystemExit('Native master contains non-transparent pixels below locked header.')

          if not footer.exists():
              raise SystemExit(f'Missing approved footer: {footer}')
          if file_sha(footer) != EXPECTED_FOOTER_FILE_SHA:
              raise SystemExit(f'Footer file checksum mismatch: {file_sha(footer)}')
          footer_im = Image.open(footer).convert('RGBA')
          if footer_im.size != (1080, 1350):
              raise SystemExit(f'Footer dimensions mismatch: {footer_im.size}')
          footer_pixel_sha = hashlib.sha256(footer_im.tobytes()).hexdigest()
          if footer_pixel_sha != EXPECTED_FOOTER_PIXEL_SHA:
              raise SystemExit(f'Footer pixel checksum mismatch: {footer_pixel_sha}')

          print('VERIFIED native RC5 header-only master:', dst_master, dst_master.stat().st_size, 'bytes')
          print('VERIFIED exact RC5 footer:', footer, footer.stat().st_size, 'bytes')
          PY

      - name: Commit exact native RC5 asset composition
        shell: bash
        run: |
          git config user.name 'rdeane-create'
          git config user.email 'rdeane@christchurchschool.org'
          git add assets/Reference/CHRISTCHURCH_HERO_CARD_MASTER_v1_APPROVED.png
          if git diff --cached --quiet; then
            echo 'Native RC5 asset composition already correct.'
            exit 0
          fi
          git commit -m 'Use approved header-only master for editable RC5 Hero cards'
          git push
