name: Restore exact RC5 Hero assets from Studio bridge

on:
  push:
    paths:
      - '.github/workflows/restore-hero-footer-from-bridge.yml'

permissions:
  contents: write

jobs:
  restore-hero-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Recover and verify exact RC5 Hero assets from Drive
        shell: bash
        env:
          BRIDGE: https://script.google.com/a/macros/christchurchschool.org/s/AKfycbwVpWix_ivzxwpEQxNTBGvJNpThQYjfRRG8T7CYMNPz3r9lB-JI6CowrskoQUAs67lt/exec
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, struct, urllib.parse, urllib.request

          bridge = os.environ['BRIDGE']
          specs = [
              {
                  'name':'CHRISTCHURCH_HERO_CARD_MASTER_v1_APPROVED.png',
                  'dims':(1023,1537),
                  'sha256':'ade1907e4d610e0f08967c51476b97eada1c7bc188876299d957a75d953c7086',
              },
              {
                  'name':'HERO_FOOTER_OVERLAY_v1.png',
                  'dims':(1080,1350),
                  'sha256':'43e4e717e30cc151960d8aeb7e01dd3ee6150001b411f095a7240aac3237eeba',
              },
          ]

          def get_json(params):
              url = bridge + '?' + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={'User-Agent':'CSMS-RC5-Exact-Asset-Restore/1.0'})
              with urllib.request.urlopen(req, timeout=90) as r:
                  body = r.read()
                  ctype = r.headers.get('content-type','')
              try:
                  return json.loads(body.decode('utf-8'))
              except Exception:
                  raise SystemExit(f'Bridge did not return JSON ({ctype}); first bytes={body[:160]!r}')

          def rank(m):
              p=(m.get('path') or '').lower()
              score=0
              if 'assets' in p: score+=20
              if 'reference' in p: score+=20
              if 'sprint_1_1_2_update' in p: score+=10
              if 'studio' in p: score+=5
              return score

          outdir=pathlib.Path('assets/Reference')
          outdir.mkdir(parents=True,exist_ok=True)

          for spec in specs:
              filename=spec['name']
              found=get_json({'action':'findfilerecursive','name':filename})
              if not found.get('ok'):
                  raise SystemExit(f'Bridge lookup failed for {filename}: '+json.dumps(found)[:1000])
              matches=found.get('matches') or []
              if not matches:
                  raise SystemExit(f'Exact RC5 asset not found in Drive: {filename}')

              accepted=None
              rejected=[]
              for match in sorted(matches,key=rank,reverse=True):
                  try:
                      payload=get_json({'action':'file','fileId':match['id']})
                      if not payload.get('ok') or not payload.get('data'):
                          rejected.append((match.get('path'),'no payload'))
                          continue
                      raw=base64.b64decode(payload['data'])
                      if not raw.startswith(b'\x89PNG\r\n\x1a\n'):
                          rejected.append((match.get('path'),'not PNG'))
                          continue
                      w,h=struct.unpack('>II',raw[16:24])
                      digest=hashlib.sha256(raw).hexdigest()
                      if (w,h)!=spec['dims']:
                          rejected.append((match.get('path'),f'dimensions {w}x{h}'))
                          continue
                      if digest!=spec['sha256']:
                          rejected.append((match.get('path'),f'sha256 {digest}'))
                          continue
                      accepted=(match,raw,w,h,digest)
                      break
                  except Exception as exc:
                      rejected.append((match.get('path'),str(exc)))

              if not accepted:
                  raise SystemExit(f'No byte-exact RC5 candidate passed for {filename}: '+json.dumps(rejected)[:5000])

              match,raw,w,h,digest=accepted
              out=outdir/filename
              out.write_bytes(raw)
              print(f'VERIFIED {filename}: {len(raw)} bytes {w}x{h} sha256={digest} Drive={match.get("path")}')
          PY

      - name: Commit exact verified RC5 Hero assets
        shell: bash
        run: |
          git config user.name 'rdeane-create'
          git config user.email 'rdeane@christchurchschool.org'
          git add assets/Reference/CHRISTCHURCH_HERO_CARD_MASTER_v1_APPROVED.png assets/Reference/HERO_FOOTER_OVERLAY_v1.png
          if git diff --cached --quiet; then
            echo 'Exact RC5 Hero assets already match.'
            exit 0
          fi
          git commit -m 'Restore byte-exact RC5 Hero master and footer assets'
          git push
