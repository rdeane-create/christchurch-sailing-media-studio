name: Finish native Hero movement range

on:
  push:
    paths:
      - '.github/workflows/restore-hero-footer-from-bridge.yml'

permissions:
  contents: write

jobs:
  finish-native-hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Expand native Hero movement controls
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('index.html')
          t=p.read_text()
          original=t

          pairs=[
            ('<input id="heroBuilderOffsetX" type="range" min="-100" max="100" value="0">',
             '<input id="heroBuilderOffsetX" type="range" min="-1800" max="1800" step="1" value="0">',
             'horizontal crop range'),
            ('<input id="heroBuilderOffsetY" type="range" min="-100" max="100" value="0">',
             '<input id="heroBuilderOffsetY" type="range" min="-1800" max="1800" step="1" value="0">',
             'vertical crop range'),
            ('g.font=`italic 900 ${firstSize}px Arial`;',
             'g.font=`italic 900 ${firstSize}px "Avenir Next Condensed","Helvetica Neue Condensed","Arial Narrow",sans-serif`;',
             'remaining approved first-name font')
          ]
          for old,new,label in pairs:
              count=t.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              t=t.replace(old,new,1)
              print('patched:',label)

          if t==original: raise SystemExit('No changes made')
          p.write_text(t)
          PY

      - name: Validate movement controls
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          t=pathlib.Path('index.html').read_text()
          assert 'id="heroBuilderOffsetX" type="range" min="-1800" max="1800"' in t
          assert 'id="heroBuilderOffsetY" type="range" min="-1800" max="1800"' in t
          assert 'g.font=`italic 900 ${firstSize}px "Avenir Next Condensed"' in t
          print('PASS: native Hero drag and slider movement now share the full pixel range.')
          PY

      - name: Commit final native Hero movement fix
        shell: bash
        run: |
          git config user.name 'rdeane-create'
          git config user.email 'rdeane@christchurchschool.org'
          git add index.html
          git commit -m 'Expand native Hero drag and slider movement'
          git push
