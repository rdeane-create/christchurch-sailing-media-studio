name: Fix RC5 Hero upload and gradient

on:
  push:
    paths:
      - '.github/workflows/restore-hero-footer-from-bridge.yml'

permissions:
  contents: write

jobs:
  fix-hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install image tools
        run: python3 -m pip install --quiet pillow

      - name: Repair photo storage migration and build smooth gradient
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          from PIL import Image
          index=pathlib.Path('index.html')
          text=index.read_text()
          old="  function openCreativeAssetDB(){\n    return new Promise((resolve,reject)=>{\n      const req=indexedDB.open(ASSET_DB,1);\n      req.onupgradeneeded=()=>{\n        const db=req.result;\n        if(!db.objectStoreNames.contains(ASSET_STORE))db.createObjectStore(ASSET_STORE,{keyPath:'id'});\n      };\n      req.onsuccess=()=>resolve(req.result);\n      req.onerror=()=>reject(req.error);\n    });\n  }\n"
          new="  function openCreativeAssetDB(){\n    return new Promise((resolve,reject)=>{\n      const req=indexedDB.open(ASSET_DB,2);\n      req.onupgradeneeded=()=>{\n        const db=req.result;\n        if(!db.objectStoreNames.contains(ASSET_STORE))db.createObjectStore(ASSET_STORE,{keyPath:'id'});\n      };\n      req.onsuccess=()=>{\n        const db=req.result;\n        if(db.objectStoreNames.contains(ASSET_STORE)){resolve(db);return;}\n        const nextVersion=Math.max(2,Number(db.version||1)+1);\n        db.close();\n        const repair=indexedDB.open(ASSET_DB,nextVersion);\n        repair.onupgradeneeded=()=>{\n          const repairDb=repair.result;\n          if(!repairDb.objectStoreNames.contains(ASSET_STORE))repairDb.createObjectStore(ASSET_STORE,{keyPath:'id'});\n        };\n        repair.onsuccess=()=>resolve(repair.result);\n        repair.onerror=()=>reject(repair.error);\n      };\n      req.onerror=()=>reject(req.error);\n    });\n  }\n"
          if old in text:
              text=text.replace(old,new,1)
              index.write_text(text)
              print('Patched creativeAssets IndexedDB migration.')
          elif new in text:
              print('IndexedDB migration already patched.')
          else:
              raise SystemExit('Could not locate guarded creative asset database function.')
          w,h=1080,1350
          navy=(3,18,39)
          top,mid,bottom=560,890,h-1
          im=Image.new('RGBA',(w,h),(0,0,0,0))
          px=im.load()
          for y in range(h):
              if y<=top: alpha=0
              elif y<=mid:
                  t=(y-top)/(mid-top)
                  alpha=round(120*(t*t))
              else:
                  t=(y-mid)/(bottom-mid)
                  alpha=round(120+(125*(1-(1-t)*(1-t))))
              alpha=max(0,min(245,alpha))
              for x in range(w): px[x,y]=(*navy,alpha)
          footer=pathlib.Path('assets/Reference/HERO_FOOTER_OVERLAY_v1.png')
          im.save(footer,'PNG',optimize=True)
          check=Image.open(footer).convert('RGBA')
          assert check.size==(1080,1350)
          assert check.getpixel((540,100))[3]==0
          assert check.getpixel((540,1349))[3]>=235
          print('Built clean smooth Hero footer gradient.')
          PY

      - name: Validate targeted changes
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          from PIL import Image
          text=pathlib.Path('index.html').read_text()
          assert "indexedDB.open(ASSET_DB,2)" in text
          assert "repair.onupgradeneeded" in text
          footer=Image.open('assets/Reference/HERO_FOOTER_OVERLAY_v1.png').convert('RGBA')
          assert footer.size==(1080,1350)
          assert footer.getpixel((540,100))[3]==0
          assert footer.getpixel((540,1349))[3]>=235
          print('PASS: upload migration and smooth gradient validated.')
          PY

      - name: Commit focused Hero repair
        shell: bash
        run: |
          git config user.name 'rdeane-create'
          git config user.email 'rdeane@christchurchschool.org'
          git add index.html assets/Reference/HERO_FOOTER_OVERLAY_v1.png
          if git diff --cached --quiet; then
            echo 'Hero upload and gradient are already correct.'
            exit 0
          fi
          git commit -m 'Fix Hero photo upload and smooth footer gradient'
          git push
