name: Patch actual Hero Builder renderer

on:
  push:
    paths:
      - '.github/workflows/restore-hero-footer-from-bridge.yml'

permissions:
  contents: write

jobs:
  patch-hero-builder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch and validate actual Hero Builder
        run: python3 .github/scripts/patch_actual_hero_builder.py
      - name: Commit Hero visual fidelity repair
        run: |
          git config user.name 'rdeane-create'
          git config user.email 'rdeane@christchurchschool.org'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No Hero visual changes to commit.'
            exit 0
          fi
          git commit -m 'Restore Hero typography proportions and header fade'
          git push
