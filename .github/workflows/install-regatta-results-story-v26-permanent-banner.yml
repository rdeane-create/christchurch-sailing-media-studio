name: Install Regatta Results Story v26 Permanent Banner
on:
  push:
    paths:
      - '.github/workflows/install-regatta-results-story-v26-permanent-banner.yml'
      - '.github/scripts/install_regatta_results_story_v26_permanent_banner.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install permanent fixed banner
        run: python .github/scripts/install_regatta_results_story_v26_permanent_banner.py
      - name: Validate permanent banner contract
        run: |
          python - <<'PY'
          from pathlib import Path
          js=Path('regatta-results-story.js').read_text()
          assert "REGATTA RESULTS STORY — BUILD v26" in js
          assert "const BANNER_BG='#eef1f4';" in js
          assert "const SOLID_H=251,FADE_H=110;" in js
          assert "drawAthleteMainExactStage(ctx);drawFadeBridge(ctx);drawCoverBand(ctx);drawFinalHeader(ctx);" in js
          assert "Permanent fixed banner • photo moves behind it • results panel unchanged" in js
          assert "const leftY=1370,rightY=1185" in js
          print('Permanent banner contract validated')
          PY
      - name: Commit permanent banner
        run: |
          git config user.name "rdeane-create"
          git config user.email "rdeane@christchurchschool.org"
          git add regatta-results-story.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Lock Regatta Results permanent fixed banner"
          git push
