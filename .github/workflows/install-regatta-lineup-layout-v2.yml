name: Install Regatta Lineup Layout v7

on:
  push:
    paths:
      - 'regatta-lineup-layout-v2.js'
      - 'install-regatta-lineup-layout-v7.py'
      - '.github/workflows/install-regatta-lineup-layout-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Regatta controls
        run: python3 install-regatta-lineup-layout-v7.py

      - name: Validate stable Regatta controls
        run: |
          grep -q 'id="workspace-video"' index.html
          grep -q 'id="renderBtn"' index.html
          grep -q 'regatta-lineup-layout-v2.js?v=20260814-regatta-lineup-layout-v7' index.html
          grep -q "regatta-lineup-layout-v7" regatta-lineup-layout-v2.js
          grep -q "if(heading.nextElementSibling!==bar)" regatta-lineup-layout-v2.js
          grep -q "if(current!==b)bar.insertBefore" regatta-lineup-layout-v2.js
          grep -q "box.parentElement!==panel" regatta-lineup-layout-v2.js

      - name: Commit stable Regatta controls
        run: |
          git config user.name 'rdeane-create'
          git config user.email 'rdeane@christchurchschool.org'
          git add regatta-lineup-layout-v2.js index.html
          if git diff --cached --quiet; then
            echo 'Stable Regatta controls already installed.'
            exit 0
          fi
          git commit -m 'Stop Regatta preview controls from reflowing'
          git push
