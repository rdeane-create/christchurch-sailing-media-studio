name: Install Regatta Lineup Layout v2

on:
  push:
    paths:
      - 'regatta-lineup-layout-v2.js'
      - '.github/workflows/install-regatta-lineup-layout-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Regatta Lineup layout helper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          t=p.read_text()
          t=re.sub(r'\s*<script src="regatta-lineup-layout-v2\.js\?v=[^"]+"></script>\s*','\n',t)
          marker='<script src="regatta-lineup-layout-v2.js?v=20260814-regatta-lineup-layout-v2"></script>'
          if '</body>' not in t:
              raise SystemExit('Missing </body>')
          t=t.replace('</body>',marker+'\n</body>',1)
          p.write_text(t)
          PY

      - name: Validate surviving Regatta Lineup engine and helper
        run: |
          grep -q 'id="workspace-video"' index.html
          grep -q 'id="athleteFiles"' index.html
          grep -q 'id="renderBtn"' index.html
          grep -q 'regatta-lineup-layout-v2.js?v=20260814-regatta-lineup-layout-v2' index.html
          grep -q "listSavedCards" regatta-lineup-layout-v2.js
          grep -q "getSavedCard" regatta-lineup-layout-v2.js
          grep -q "REGATTA LINEUP" regatta-lineup-layout-v2.js

      - name: Commit Regatta Lineup layout install
        run: |
          git config user.name 'rdeane-create'
          git config user.email 'rdeane@christchurchschool.org'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Regatta Lineup layout already installed.'
            exit 0
          fi
          git commit -m 'Install Regatta Lineup athlete card library and layout'
          git push
