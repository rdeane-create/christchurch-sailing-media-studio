name: Install Hero Builder v3 from approved master

on:
  push:
    paths:
      - 'hero-builder-v3.js'
      - '.github/workflows/install-hero-builder-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build new HeroV3 assets from approved master only
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib

          source=Path('assets/Reference/CHRISTCHURCH_HERO_CARD_MASTER_v1_APPROVED(1).png')
          out=Path('assets/HeroV3')
          out.mkdir(parents=True,exist_ok=True)
          expected='ade1907e4d610e0f08967c51476b97eada1c7bc188876299d957a75d953c7086'
          raw=source.read_bytes()
          actual=hashlib.sha256(raw).hexdigest()
          if actual!=expected:
              raise SystemExit(f'Approved visual master checksum changed: {actual}')
          master=Image.open(source).convert('RGBA')
          if master.size!=(1023,1537):
              raise SystemExit(f'Approved master is {master.size}, expected 1023x1537')

          # New v3 assets are generated from the approved image; no old Hero
          # renderer assets are copied or referenced by the new builder.
          header=master.crop((0,0,1023,218))
          header.save(out/'hero-header-master.png','PNG',optimize=True)
          master.save(out/'hero-visual-reference.png','PNG',optimize=True)
          (out/'MASTER_CONTRACT.txt').write_text(
              'HERO BUILDER V3 MASTER CONTRACT\n'
              'Source: CHRISTCHURCH_HERO_CARD_MASTER_v1_APPROVED(1).png\n'
              'Canvas: 1023 x 1537\n'
              'Header: exact source pixels x=0..1022, y=0..217\n'
              'First name bbox: x=68..340, y=1136..1172\n'
              'Last name bbox: x=48..446, y=1192..1358\n'
              'Orange rule bbox: x=51..422, y=1381..1385\n'
              'Class line bbox: x=52..422, y=1412..1436\n'
              'Editable: photo, first name, last name, class year, optional text, crop.\n'
          )
          print('PASS: created new HeroV3 assets from approved master',actual)
          PY

      - name: Validate new standalone module
        run: |
          node --check hero-builder-v3.js
          test -s assets/HeroV3/hero-header-master.png
          test -s assets/HeroV3/hero-visual-reference.png
          grep -q "const W=1023,H=1537" hero-builder-v3.js
          grep -q "bindCanvasDrag" hero-builder-v3.js
          grep -q "heroBuilderV3Canvas" hero-builder-v3.js
          grep -q "heroBlob" hero-builder-v3.js

      - name: Replace all prior Hero module loaders with v3
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          t=p.read_text()
          # Remove standalone Hero v2/v3 loaders. The generic Studio remains intact;
          # Hero Builder v3 owns the Hero screen whenever it is open.
          t=re.sub(r'\s*<script src="hero-card-master-v2\.js(?:\?v=[^"]*)?"></script>\s*','\n',t)
          t=re.sub(r'\s*<script src="hero-builder-v3\.js(?:\?v=[^"]*)?"></script>\s*','\n',t)
          marker='<script src="hero-builder-v3.js?v=20260812-1"></script>'
          if '</body>' not in t:
              raise SystemExit('Install guard failed: </body> not found')
          t=t.replace('</body>',marker+'\n</body>',1)
          if t.count('hero-builder-v3.js')!=1:
              raise SystemExit('v3 loader count is not exactly one')
          if 'hero-card-master-v2.js' in t:
              raise SystemExit('v2 loader still present in index.html')
          p.write_text(t)
          print('PASS: v2 loader removed; v3 installed exactly once')
          PY

      - name: Final production validation
        run: |
          node --check hero-builder-v3.js
          grep -q '<script src="hero-builder-v3.js?v=20260812-1"></script>' index.html
          ! grep -q 'hero-card-master-v2.js' index.html

      - name: Commit clean v3 production install
        run: |
          git config user.name 'rdeane-create'
          git config user.email 'rdeane@christchurchschool.org'
          git add index.html hero-builder-v3.js assets/HeroV3
          if git diff --cached --quiet; then
            echo 'Hero Builder v3 already installed.'
            exit 0
          fi
          git commit -m 'Install master-driven Hero Builder v3'
          git push
