name: Validate Hero Builder v3 vector contract

on:
  push:
    paths:
      - 'hero-builder-v3.js'
      - '.github/workflows/install-hero-builder-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Correct and lock internal vector alphabet
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('hero-builder-v3.js')
          t=p.read_text()
          start=t.find('const G={')
          end=t.find('function glyphWidth',start)
          if start<0 or end<0:
              raise SystemExit('Vector alphabet anchors not found')
          replacement=r'''const SEG={
 a:[0,0,4,0],b:[4,0,4,3],c:[4,3,4,6],d:[0,6,4,6],e:[0,3,0,6],f:[0,0,0,3],g:[0,3,4,3],
 h:[0,0,2,3],i:[4,0,2,3],j:[0,6,2,3],k:[4,6,2,3],v:[2,0,2,6],p:[2,3,2,6]
};
const G={
 A:'abcefg',B:'fegcdb',C:'afed',D:'fbcde',E:'afged',F:'afge',G:'afedcg',H:'fbgec',I:'avd',J:'bcd',K:'fejik',L:'fed',M:'fhbic',N:'fhkc',O:'abcdef',P:'abfg e'.replace(/ /g,''),Q:'abcdefk',R:'abfgek',S:'afgcd',T:'av',U:'fbcde',V:'fjk',W:'fejkc',X:'hijk',Y:'hip',Z:'aijd',
 '0':'abcdef','1':'bc','2':'abged','3':'abgcd','4':'fgbc','5':'afgcd','6':'afgecd','7':'abc','8':'abcdefg','9':'abfgcd','-':'g','.':'dot','&':'afgehkcd',' ':''
};
'''
          t=t[:start]+replacement+t[end:]
          old="for(const ch of s){const strokes=G[ch]||G[' '],gw=glyphWidth(ch);for(const code of strokes){const a=segPoint(code[0]+code[1]),b=segPoint(code[2]+code[3]);if(code==='2626'){ctx.beginPath();ctx.arc((pen+1.2)*sx,6.7*unit,ctx.lineWidth*.42,0,Math.PI*2);ctx.fill();continue;}ctx.beginPath();ctx.moveTo((pen+a.x)*sx,a.y*unit);ctx.lineTo((pen+b.x)*sx,b.y*unit);ctx.stroke();}pen+=gw+tracking;}"
          new="for(const ch of s){const strokes=G[ch]||G[' '],gw=glyphWidth(ch);if(strokes==='dot'){ctx.beginPath();ctx.arc((pen+1.2)*sx,6.55*unit,ctx.lineWidth*.42,0,Math.PI*2);ctx.fill();}else for(const key of strokes){const seg=SEG[key];if(!seg)continue;ctx.beginPath();ctx.moveTo((pen+seg[0])*sx,seg[1]*unit);ctx.lineTo((pen+seg[2])*sx,seg[3]*unit);ctx.stroke();}pen+=gw+tracking;}"
          if old not in t:
              raise SystemExit('Old vector stroke loop not found')
          t=t.replace(old,new,1)
          t=t.replace("function segPoint(ch){const n=Number(ch);return{x:(n%10),y:Math.floor(n/10)};}\n",'',1)
          p.write_text(t)
          print('PASS: corrected internal Hero vector alphabet')
          PY

      - name: Validate browser-independent Hero contract
        run: |
          node --check hero-builder-v3.js
          grep -q "const VERSION='3.3.0'" hero-builder-v3.js
          grep -q "const W=1080,H=1350" hero-builder-v3.js
          grep -q "const SEG=" hero-builder-v3.js
          grep -q "function vectorLine" hero-builder-v3.js
          grep -q "function drawHeaderFade" hero-builder-v3.js
          grep -q "bindCanvasDrag" hero-builder-v3.js
          grep -q "async function saveHero" hero-builder-v3.js
          grep -q "function exportHero" hero-builder-v3.js
          ! grep -q "document.fonts" hero-builder-v3.js
          ! grep -q "ctx.font" hero-builder-v3.js
          ! grep -q "Arial" hero-builder-v3.js
          ! grep -q "Barlow" hero-builder-v3.js
          test -s assets/HeroV3/hero-header-master.png

      - name: Keep Hero Builder loaded exactly once
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          t=p.read_text()
          t=re.sub(r'\s*<script src="hero-builder-v3\.js(?:\?v=[^"]*)?"></script>\s*','\n',t)
          marker='<script src="hero-builder-v3.js?v=20260812-33"></script>'
          if '</body>' not in t:
              raise SystemExit('</body> not found')
          t=t.replace('</body>',marker+'\n</body>',1)
          if t.count('hero-builder-v3.js')!=1:
              raise SystemExit('Hero Builder loader count is not one')
          p.write_text(t)
          PY

      - name: Commit vector Hero production state
        run: |
          git config user.name 'rdeane-create'
          git config user.email 'rdeane@christchurchschool.org'
          git add hero-builder-v3.js index.html
          if git diff --cached --quiet; then
            echo 'Vector Hero contract already current.'
            exit 0
          fi
          git commit -m 'Lock browser-independent Hero vector typography'
          git push
