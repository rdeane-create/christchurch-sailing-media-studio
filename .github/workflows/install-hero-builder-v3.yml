name: Install Hero Builder v3 from frozen RC5 contract

on:
  push:
    paths:
      - 'hero-builder-v3.js'
      - '.github/workflows/install-hero-builder-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build new HeroV3 locked header from approved source
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib

          source=Path('assets/Reference/CHRISTCHURCH_HERO_CARD_MASTER_v1_APPROVED(1).png')
          out=Path('assets/HeroV3')
          out.mkdir(parents=True,exist_ok=True)
          expected='ade1907e4d610e0f08967c51476b97eada1c7bc188876299d957a75d953c7086'
          actual=hashlib.sha256(source.read_bytes()).hexdigest()
          if actual!=expected:
              raise SystemExit(f'Approved source checksum changed: {actual}')
          source_image=Image.open(source).convert('RGBA')
          if source_image.size!=(1023,1537):
              raise SystemExit(f'Approved source dimensions changed: {source_image.size}')

          # The frozen RC5 Studio contract uses only the exact 1023x218 locked
          # source header, scaled into a 1080x209 region on a 1080x1350 card.
          header=source_image.crop((0,0,1023,218))
          header.save(out/'hero-header-master.png','PNG',optimize=True)
          (out/'MASTER_CONTRACT.txt').write_text(
              'HERO BUILDER V3.2 — FROZEN RC5 CONTRACT\n'
              'Output canvas: 1080 x 1350 (4:5)\n'
              'Locked header source: exact approved pixels 1023 x 218\n'
              'Locked header destination: x=0 y=0 w=1080 h=209\n'
              'First Name: x=66 y=992 w=540 h=64 Arial italic 58 weight 700 tracking 12\n'
              'Last Name: x=56 y=1058 w=650 h=164 Arial Narrow italic 162 weight 800 tracking 2\n'
              'Graduation Year: x=60 y=1248 w=620 h=48 Arial italic 48 weight 700 tracking 10 #f04b1a\n'
              'Achievement: x=60 y=1300 w=840 h=38 Arial italic 30 weight 600 tracking 5\n'
              'Editable: photo, first name, last name, class year, optional text, crop/position.\n'
          )
          print('PASS: rebuilt only the exact locked header and wrote frozen RC5 contract')
          PY

      - name: Validate frozen RC5 standalone module
        run: |
          node --check hero-builder-v3.js
          test -s assets/HeroV3/hero-header-master.png
          grep -q "const VERSION='3.2.0'" hero-builder-v3.js
          grep -q "const W=1080,H=1350" hero-builder-v3.js
          grep -q 'Arial Narrow' hero-builder-v3.js
          grep -q 'italic 800 162px' hero-builder-v3.js
          grep -q 'italic 700 58px' hero-builder-v3.js
          grep -q 'italic 700 48px' hero-builder-v3.js
          grep -q "bindCanvasDrag" hero-builder-v3.js
          grep -q "heroBuilderV3Canvas" hero-builder-v3.js
          grep -q "heroBlob" hero-builder-v3.js
          ! grep -q 'Barlow Condensed' hero-builder-v3.js

      - name: Replace all prior Hero module loaders with v3.2
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          t=p.read_text()
          t=re.sub(r'\s*<script src="hero-card-master-v2\.js(?:\?v=[^"]*)?"></script>\s*','\n',t)
          t=re.sub(r'\s*<script src="hero-builder-v3\.js(?:\?v=[^"]*)?"></script>\s*','\n',t)
          marker='<script src="hero-builder-v3.js?v=20260812-32"></script>'
          if '</body>' not in t:
              raise SystemExit('Install guard failed: </body> not found')
          t=t.replace('</body>',marker+'\n</body>',1)
          if t.count('hero-builder-v3.js')!=1:
              raise SystemExit('v3 loader count is not exactly one')
          if 'hero-card-master-v2.js' in t:
              raise SystemExit('v2 loader still present in index.html')
          p.write_text(t)
          print('PASS: v3.2 installed exactly once; v2 removed')
          PY

      - name: Final production validation
        run: |
          node --check hero-builder-v3.js
          grep -q '<script src="hero-builder-v3.js?v=20260812-32"></script>' index.html
          ! grep -q 'hero-card-master-v2.js' index.html
          grep -q 'Output canvas: 1080 x 1350 (4:5)' assets/HeroV3/MASTER_CONTRACT.txt

      - name: Commit frozen RC5 v3.2 production install
        run: |
          git config user.name 'rdeane-create'
          git config user.email 'rdeane@christchurchschool.org'
          git add index.html hero-builder-v3.js assets/HeroV3/hero-header-master.png assets/HeroV3/MASTER_CONTRACT.txt
          if git diff --cached --quiet; then
            echo 'Hero Builder v3.2 already installed.'
            exit 0
          fi
          git commit -m 'Install frozen RC5 Hero Builder v3.2'
          git push
