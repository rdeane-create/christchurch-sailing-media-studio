<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Christchurch Team Introduction Builder</title>
<style>
:root{--navy:#07152f;--orange:#ff6f18;--ink:#10213c;--line:#dbe3ee;--muted:#63748a}*{box-sizing:border-box}body{margin:0;background:#eef2f7;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.app{max-width:1180px;margin:auto;padding:18px;display:grid;grid-template-columns:350px 1fr;gap:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}h1{margin:0 0 6px;font-size:22px;color:var(--navy)}p{margin:0 0 10px;color:var(--muted);line-height:1.4}label{display:block;font-size:13px;font-weight:800;margin:12px 0 6px}input,select,button{font:inherit}input[type=text],select{width:100%;padding:10px;border:1px solid #cbd6e4;border-radius:9px}select[multiple]{min-height:150px}input[type=file]{width:100%;font-size:13px}button{border:0;border-radius:9px;background:#e9eef6;color:#163052;font-weight:800;padding:11px 12px;cursor:pointer}.primary{background:var(--orange);color:#fff}.full{width:100%}.actions{display:grid;gap:8px;margin-top:12px}.stage{background:#08152e;border-radius:14px;min-height:620px;display:grid;place-items:center;padding:14px}.placeholder{color:#fff;text-align:center;max-width:420px}.placeholder strong{display:block;font-size:28px;margin-bottom:8px}canvas{display:none;width:min(100%,520px);height:auto;aspect-ratio:4/5;background:#07152f;border-radius:10px;box-shadow:0 18px 45px rgba(0,0,0,.35)}.hint{font-size:12px;color:#66758a;margin-top:6px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.count{font-weight:800;color:var(--navy)}.divider{height:1px;background:var(--line);margin:14px 0}@media(max-width:860px){.app{grid-template-columns:1fr}.stage{min-height:420px}}
</style>
</head>
<body>
<div class="app">
<section class="panel">
<h1>Team Introduction</h1>
<p>Standalone builder for large rosters. It does not load the main Studio.</p>

<label for="savedCards">Saved Athlete Main Headshots</label>
<select id="savedCards" multiple></select>
<div class="actions">
<button id="loadDrive" class="primary" type="button">Load Main Studio Saved Cards</button>
<button id="addSaved" type="button">Add Selected Saved Cards</button>
<button id="addAllSaved" type="button">Add All Loaded Saved Cards</button>
<button id="loadLocal" type="button">Try Browser Saved Headshots</button>
</div>
<div class="hint">This reads the Athlete Main cards saved from the main Studio, without opening the heavy Studio page.</div>

<div class="divider"></div>
<label for="photos">Add headshots from computer</label>
<input id="photos" type="file" accept="image/*" multiple>
<button id="addFiles" class="full" type="button" style="margin-top:8px">Add Chosen Files</button>

<label for="title">Bottom line</label>
<input id="title" type="text" value="Introducing your 2026/2027 Seahorses">
<div class="row"><div><label for="columns">Columns</label><select id="columns"><option>6</option><option selected>7</option><option>8</option><option>9</option><option>10</option></select></div><div><label for="fit">Fit</label><select id="fit"><option value="cover" selected>Fill</option><option value="contain">Fit</option></select></div></div>
<div class="row"><div><label for="speed">Motion speed <span id="speedVal">2.4s</span></label><input id="speed" type="range" min="400" max="60000" value="2400" step="100"></div><div><label for="hold">Hold time <span id="holdVal">1.1s</span></label><input id="hold" type="range" min="0" max="60000" value="1100" step="100"></div></div>

<div class="actions">
<button id="build" class="primary" type="button">Build Preview</button>
<button id="motion" type="button">Play Motion Preview</button>
<button id="download" type="button">Download PNG</button>
<button id="video" type="button">Download Video</button>
<button id="clear" type="button">Clear</button>
</div>
<div id="status" class="hint">Ready. <span class="count">0</span> headshots loaded.</div>
</section>
<section class="stage"><div id="placeholder" class="placeholder"><strong>Ready</strong><span>Load saved cards or choose files, then build the preview.</span></div><canvas id="canvas" width="1080" height="1350"></canvas></section>
</div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const canvas=$('canvas'),ctx=canvas.getContext('2d'),status=$('status'),placeholder=$('placeholder'),saved=$('savedCards');
const LOCAL_DB='ChristchurchMediaStudio',LOCAL_STORE='media';
const SESSION_DB='ChristchurchTeamIntroBuilder',SESSION_STORE='sessions',SESSION_KEY='team-intro-main-saved-current';
const BRIDGE_URL='https://script.google.com/a/macros/christchurchschool.org/s/AKfycbwVpWix_ivzxwpEQxNTBGvJNpThQYjfRRG8T7CYMNPz3r9lB-JI6CowrskoQUAs67lt/exec?action=bridge';
const W=1080,H=1350;
let images=[],localRecords=[],driveRecords=[],bridgePort=null,bridgeReady=null,bridgeToken='',pending=new Map(),animFrame=0,animStart=0;
function msg(t){status.innerHTML=t+' <span class="count">'+images.length+'</span> headshots loaded.'}
function wait(){return new Promise(r=>setTimeout(r,0))}
function isAthleteRecord(x){return x&&(x.type==='athlete'||x.recordType==='athlete'||x.heroBlob||x.heroImage||x.renderedHero)&&Boolean(x.first||x.last||x.firstName||x.lastName||x.heroBlob)}
function labelFor(x){const name=(String(x.first||x.firstName||'')+' '+String(x.last||x.lastName||'')).trim();return name||String(x.name||x.projectName||'Athlete Main Headshot').replace(/\.png$/i,'')}
function blobFromB64(base64,mime){const bin=atob(base64),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return new Blob([bytes],{type:mime||'image/png'})}
function blobToImage(blob){return new Promise(resolve=>{const url=URL.createObjectURL(blob),img=new Image();img.onload=()=>{URL.revokeObjectURL(url);resolve(img)};img.onerror=()=>{URL.revokeObjectURL(url);resolve(null)};img.src=url})}
function dataUrlToImage(dataUrl){return new Promise(resolve=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>resolve(null);img.src=dataUrl})}
function blobToDataUrl(blob){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result||''));reader.onerror=()=>reject(reader.error||new Error('Could not read image'));reader.readAsDataURL(blob)})}
async function addBlob(blob){const dataUrl=await blobToDataUrl(blob),img=await dataUrlToImage(dataUrl);if(!img)return false;images.push({img,dataUrl});saveSession();return true}
function imageOf(item){return item&&item.img?item.img:item}
function fileToImage(file){return blobToImage(file)}
function openSessionDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(SESSION_DB,1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(SESSION_STORE))db.createObjectStore(SESSION_STORE,{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error('Session storage could not open'))})}
async function saveSession(){try{const db=await openSessionDB();const tx=db.transaction(SESSION_STORE,'readwrite');tx.objectStore(SESSION_STORE).put({id:SESSION_KEY,updatedAt:Date.now(),settings:{title:$('title').value,columns:$('columns').value,fit:$('fit').value,speed:$('speed').value,hold:$('hold').value},images:images.map(item=>item.dataUrl).filter(Boolean)})}catch(_){ }}
async function restoreSession(){try{const db=await openSessionDB();const record=await new Promise((resolve,reject)=>{const tx=db.transaction(SESSION_STORE,'readonly'),req=tx.objectStore(SESSION_STORE).get(SESSION_KEY);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error)});if(!record||!Array.isArray(record.images)||!record.images.length)return;const s=record.settings||{};$('title').value=s.title||$('title').value;$('columns').value=s.columns||$('columns').value;$('fit').value=s.fit||$('fit').value;$('speed').value=s.speed||$('speed').value;$('hold').value=s.hold||$('hold').value;updateSpeedLabels();images=[];for(const dataUrl of record.images){const img=await dataUrlToImage(dataUrl);if(img)images.push({img,dataUrl});await wait()}draw(1);msg('Recovered saved Team Intro session.')}catch(_){ }}
function fillSavedSelect(records,source){saved.innerHTML='';if(records.length){const first=document.createElement('option');first.disabled=true;first.textContent='Select one or more saved cards below';saved.append(first)}records.forEach((r,i)=>{const o=document.createElement('option');o.value=source+':'+i;o.textContent=labelFor(r);saved.append(o)});if(!records.length){const o=document.createElement('option');o.disabled=true;o.textContent='No saved Athlete Main Headshots found';saved.append(o)}}
function openLocalDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(LOCAL_DB);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error('Saved library could not open'))})}
async function getLocalRecords(){const db=await openLocalDB();return await new Promise((resolve,reject)=>{const tx=db.transaction(LOCAL_STORE,'readonly'),req=tx.objectStore(LOCAL_STORE).getAll();req.onsuccess=()=>resolve((req.result||[]).filter(isAthleteRecord));req.onerror=()=>reject(req.error)})}
async function loadLocal(){msg('Checking saved Studio headshots...');try{localRecords=await getLocalRecords();localRecords.sort((a,b)=>labelFor(a).localeCompare(labelFor(b)));driveRecords=[];fillSavedSelect(localRecords,'local');msg(localRecords.length?'Saved Studio headshots loaded. Select the ones to include.':'No local saved headshots found. Try Google Drive saved cards.')}catch(e){msg('Could not read local saved headshots. Try Google Drive saved cards.')}}
async function addSaved(){const chosen=[...saved.selectedOptions].map(o=>o.value);if(!chosen.length){msg('Select saved cards first.');return}let added=0;for(const value of chosen){await wait();const parts=value.split(':'),source=parts[0],index=Number(parts[1]);const rec=source==='drive'?driveRecords[index]:localRecords[index];let blob=null;if(source==='drive')blob=await getDriveCardBlob(rec.fileId||rec.id);else blob=rec.heroBlob||rec.heroImage||rec.renderedHero||rec.originalFile||rec.photoFile;if(blob&&await addBlob(blob))added++;msg('Added '+added+' saved card'+(added===1?'':'s')+'...')}msg('Ready to build.')}
async function addAllSaved(){const source=driveRecords.length?'drive':localRecords.length?'local':'';const records=source==='drive'?driveRecords:localRecords;if(!records.length){msg('Load Main Studio Saved Cards first.');return}images=[];let added=0;for(let index=0;index<records.length;index++){await wait();const rec=records[index];let blob=null;if(source==='drive')blob=await getDriveCardBlob(rec.fileId||rec.id);else blob=rec.heroBlob||rec.heroImage||rec.renderedHero||rec.originalFile||rec.photoFile;if(blob&&await addBlob(blob))added++;msg('Added '+added+' of '+records.length+' saved cards...')}msg('Ready to build.')}
async function addFiles(){const files=[...$('photos').files];if(!files.length){msg('Choose files first.');return}let added=0;for(const file of files){await wait();if(await addBlob(file))added++;msg('Added '+added+' file'+(added===1?'':'s')+'...')}$('photos').value='';msg('Ready to build.')}
function randomToken(){try{const b=new Uint8Array(24);crypto.getRandomValues(b);return Array.from(b).map(v=>v.toString(16).padStart(2,'0')).join('')}catch{return Date.now().toString(36)+Math.random().toString(36).slice(2)}}
function connectBridge(){if(bridgePort)return Promise.resolve(true);if(bridgeReady)return bridgeReady;bridgeToken=randomToken();bridgeReady=new Promise((resolve,reject)=>{const timeout=setTimeout(()=>{window.removeEventListener('message',onMsg);bridgeReady=null;reject(new Error('Google Drive connection timed out.'))},30000);function onMsg(event){const d=event.data||{};if(d.source!=='csms-drive-bridge'||d.type!=='channel-ready'||d.bridgeToken!==bridgeToken)return;const port=event.ports&&event.ports[0];if(!port)return;clearTimeout(timeout);window.removeEventListener('message',onMsg);bridgePort=port;port.onmessage=ev=>{const data=ev.data||{},p=pending.get(data.requestId);if(!p||data.source!=='csms-drive-bridge'||data.type!=='response')return;pending.delete(data.requestId);clearTimeout(p.timeout);data.ok?p.resolve(data.result):p.reject(new Error(data.error||'Drive request failed'))};if(port.start)port.start();resolve(true)}window.addEventListener('message',onMsg);const url=BRIDGE_URL+'&token='+encodeURIComponent(bridgeToken)+'&transport=popup&cb='+Date.now();const popup=window.open(url,'csms-drive-bridge','popup=yes,width=470,height=220,resizable=yes,scrollbars=yes');if(!popup){clearTimeout(timeout);window.removeEventListener('message',onMsg);bridgeReady=null;reject(new Error('Drive popup was blocked. Allow popups for this site.'))}});return bridgeReady}
async function bridge(action,payload){await connectBridge();return await new Promise((resolve,reject)=>{const requestId='lite_'+Date.now()+'_'+Math.random().toString(36).slice(2),timeout=setTimeout(()=>{pending.delete(requestId);reject(new Error('Drive request timed out'))},60000);pending.set(requestId,{resolve,reject,timeout});bridgePort.postMessage({source:'csms-studio',type:'request',requestId,action,payload:payload||{}})})}
async function loadDrive(){msg('Connecting to Main Studio saved cards...');try{const r=await bridge('listSavedCards',{}),all=Array.isArray(r&&r.cards)?r.cards:[];driveRecords=all.filter(c=>{const t=String(c.cardType||c.type||'').toUpperCase(),n=String(c.name||'').toUpperCase();return (t.includes('ATHLETE HEADSHOT')&&!t.includes('LINEUP'))||n.includes('ATHLETE HEADSHOT CARD')}).map(c=>({...c,id:String(c.fileId||c.id||''),fileId:String(c.fileId||c.id||'')})).filter(c=>c.fileId);localRecords=[];fillSavedSelect(driveRecords,'drive');msg(driveRecords.length?'Main Studio saved cards loaded. Select the ones to include.':'No Athlete Main Headshot cards found in Main Studio saved cards.')}catch(e){msg('Could not load Main Studio saved cards: '+e.message)}}
async function getDriveCardBlob(fileId){const r=await bridge('getSavedCard',{fileId});if(!r||!r.ok||!r.card||!r.card.data)throw new Error('Saved card unavailable');return blobFromB64(r.card.data,r.card.mimeType||'image/png')}
function fitDraw(img,x,y,w,h,mode){const iw=img.naturalWidth,ih=img.naturalHeight,ir=iw/ih,or=w/h;let sx=0,sy=0,sw=iw,sh=ih,dx=x,dy=y,dw=w,dh=h;if(mode==='cover'){if(ir>or){sw=ih*or;sx=(iw-sw)/2}else{sh=iw/or;sy=(ih-sh)/2}}else{if(ir>or){dh=w/ir;dy=y+(h-dh)/2}else{dw=h*ir;dx=x+(w-dw)/2}}ctx.drawImage(img,sx,sy,sw,sh,dx,dy,dw,dh)}
function layoutBoxes(){const footerH=170,margin=54,gap=8,cols=Number($('columns').value)||7,rows=Math.max(1,Math.ceil(images.length/cols));const y0=136,areaH=H-footerH-y0-36,tileW=(W-margin*2-gap*(cols-1))/cols,tileH=(areaH-gap*(rows-1))/rows;return images.map((_,i)=>{const col=i%cols,row=Math.floor(i/cols);return {x:margin+col*(tileW+gap),y:y0+row*(tileH+gap),w:tileW,h:tileH}})}
function drawBase(){ctx.fillStyle='#07152f';ctx.fillRect(0,0,W,H);ctx.fillStyle='rgba(255,255,255,.96)';ctx.font='900 54px Arial,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('CHRISTCHURCH SAILING',W/2,72);ctx.fillStyle='#ff6f18';ctx.fillRect(210,104,660,8)}
function drawFooter(){const footerH=170,fg=ctx.createLinearGradient(0,H-footerH-70,0,H);fg.addColorStop(0,'rgba(7,21,47,0)');fg.addColorStop(.35,'rgba(7,21,47,.92)');fg.addColorStop(1,'rgba(7,21,47,1)');ctx.fillStyle=fg;ctx.fillRect(0,H-footerH-70,W,footerH+70);ctx.fillStyle='#ff6f18';ctx.fillRect(90,H-116,900,7);ctx.fillStyle='#fff';ctx.font='800 46px Arial,sans-serif';ctx.fillText($('title').value||'Introducing your 2026/2027 Seahorses',W/2,H-54)}
function drawCard(item,box){ctx.save();ctx.beginPath();ctx.rect(box.x,box.y,box.w,box.h);ctx.clip();ctx.fillStyle='#dce4ee';ctx.fillRect(box.x,box.y,box.w,box.h);fitDraw(imageOf(item),box.x,box.y,box.w,box.h,$('fit').value);ctx.restore();ctx.strokeStyle='rgba(255,255,255,.28)';ctx.lineWidth=2;ctx.strokeRect(box.x,box.y,box.w,box.h)}
function heroBox(target,index,p){const cardRatio=4/5,heroH=Math.min(900,H*.68),heroW=heroH*cardRatio,heroX=W/2-heroW/2,heroY=205;const start={x:W/2-target.w*.45,y:230,w:target.w*.9,h:target.h*.9};const motion=Number($('speed').value||2400),hold=Number($('hold').value||1100),total=Math.max(1,motion+hold),growEnd=Math.min(.48,Math.max(.08,(motion*.42)/total)),holdEnd=Math.min(.9,Math.max(growEnd+.02,(motion*.42+hold)/total));function ease(x){return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2}if(p<growEnd){const e=ease(p/growEnd);return {x:start.x+(heroX-start.x)*e,y:start.y+(heroY-start.y)*e,w:start.w+(heroW-start.w)*e,h:start.h+(heroH-start.h)*e}}if(p<holdEnd){const b=1+.012*Math.sin(Math.PI*((p-growEnd)/(holdEnd-growEnd)));return {x:heroX-heroW*(b-1)/2,y:heroY-heroH*(b-1)/2,w:heroW*b,h:heroH*b}}const e=ease((p-holdEnd)/(1-holdEnd)),arc=Math.sin(Math.PI*e);return {x:heroX+(target.x-heroX)*e+arc*(index%2===0?34:-34),y:heroY+(target.y-heroY)*e-arc*38,w:heroW+(target.w-heroW)*e,h:heroH+(target.h-heroH)*e}}
function motionDuration(){return Math.max(1,images.length)*(Number($('speed').value||2400)+Number($('hold').value||1100))}
function draw(progress=1){if(!images.length){msg('Add saved cards or files first.');return}drawBase();const boxes=layoutBoxes();let active=-1,activeProgress=1;if(progress<1){const sequence=progress*images.length;active=Math.min(images.length-1,Math.floor(sequence));activeProgress=sequence-active}images.forEach((item,i)=>{if(progress<1&&i>=active)return;drawCard(item,boxes[i])});if(progress<1&&active>=0){ctx.fillStyle='rgba(1,8,22,.36)';ctx.fillRect(0,126,W,H-280);drawCard(images[active],heroBox(boxes[active],active,activeProgress))}drawFooter();canvas.style.display='block';placeholder.style.display='none';msg(progress<1?'Playing motion preview...':'Preview built.')}
function playMotion(){if(!images.length){msg('Add saved cards or files first.');return}cancelAnimationFrame(animFrame);animStart=performance.now();const duration=motionDuration();function step(now){const p=Math.min(1,(now-animStart)/duration);draw(p);if(p<1)animFrame=requestAnimationFrame(step);else msg('Motion preview complete.')}animFrame=requestAnimationFrame(step)}
function supportedMime(){const options=['video/mp4;codecs=avc1.42E01E','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];return window.MediaRecorder?options.find(type=>MediaRecorder.isTypeSupported(type))||'':''}
async function downloadVideo(){if(!images.length){msg('Build preview first.');return}if(!canvas.captureStream||typeof MediaRecorder==='undefined'){msg('This browser cannot create video exports. Try current Chrome, Edge, or Safari.');return}cancelAnimationFrame(animFrame);const mime=supportedMime(),stream=canvas.captureStream(30),chunks=[];let recorder;try{recorder=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:12000000}:{videoBitsPerSecond:12000000})}catch(_){stream.getTracks().forEach(track=>track.stop());msg('This browser cannot record this video.');return}recorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};const done=new Promise((resolve,reject)=>{recorder.onstop=resolve;recorder.onerror=e=>reject(e.error||new Error('Video recording failed'))});const duration=motionDuration(),started=performance.now();recorder.start(250);await new Promise(resolve=>{function step(now){const p=Math.min(1,(now-started)/duration);draw(p);msg('Rendering video '+Math.round(p*100)+'%...');if(p<1)requestAnimationFrame(step);else resolve()}requestAnimationFrame(step)});recorder.stop();await done;stream.getTracks().forEach(track=>track.stop());const blob=new Blob(chunks,{type:recorder.mimeType||mime||'video/webm'}),ext=blob.type.includes('mp4')?'mp4':'webm',a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='christchurch-team-introduction.'+ext;a.click();msg('Team Intro video download started.')}
function updateSpeedLabels(){$('speedVal').textContent=(Number($('speed').value)/1000).toFixed(1)+'s';$('holdVal').textContent=(Number($('hold').value)/1000).toFixed(1)+'s'}
$('loadLocal').addEventListener('click',()=>loadLocal());
$('addSaved').addEventListener('click',()=>addSaved().catch(e=>msg('Could not add saved cards: '+e.message)));
$('addAllSaved').addEventListener('click',()=>addAllSaved().catch(e=>msg('Could not add all saved cards: '+e.message)));
$('loadDrive').addEventListener('click',()=>loadDrive());
$('addFiles').addEventListener('click',()=>addFiles().catch(e=>msg('Could not add files: '+e.message)));
$('build').addEventListener('click',()=>draw());
$('motion').addEventListener('click',()=>playMotion());
$('download').addEventListener('click',()=>{if(!images.length){msg('Build preview first.');return}draw();const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='christchurch-team-introduction.png';a.click()});
$('video').addEventListener('click',()=>downloadVideo().catch(e=>msg('Could not render video: '+e.message)));
['title','columns','fit'].forEach(id=>$(id).addEventListener(id==='title'?'input':'change',()=>{saveSession();if(images.length)draw(1)}));
['speed','hold'].forEach(id=>$(id).addEventListener('input',()=>{updateSpeedLabels();saveSession();if(images.length)playMotion()}));
$('clear').addEventListener('click',()=>{images=[];$('photos').value='';saved.innerHTML='';canvas.style.display='none';placeholder.style.display='block';saveSession();msg('Ready.')});
msg('Ready.');
updateSpeedLabels();
restoreSession();
})();
</script>
</body>
</html>
