<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Christchurch Team Introduction Studio</title>
<style>
  :root{--navy:#07152f;--orange:#ff6f18;--white:#f8fafc;--muted:#bfc9d8}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#07152f,#020916);color:var(--white);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;padding:24px}
  main{width:min(560px,100%);display:grid;gap:16px;text-align:left}
  h1{margin:0;font-size:34px;line-height:1.05}
  p{margin:0;color:var(--muted);font-size:16px;line-height:1.45}
  a,button{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:12px;background:var(--orange);color:white;font-weight:800;font-size:16px;text-decoration:none;padding:13px 16px;cursor:pointer;width:100%}
  .secondary{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18)}
  .note{font-size:13px;color:#aebbd0}
</style>
</head>
<body>
<main>
  <h1>Team Introduction Studio</h1>
  <p>This opens the regular Christchurch Sailing Media Studio in Team Introduction mode without embedding the full app inside another page.</p>
  <button id="openStudio" type="button">Open Team Introduction</button>
  <a class="secondary" href="./?teamIntro=1&cache=20260830-team-introduction-safe">Open Studio normally</a>
  <p class="note" id="status">Ready.</p>
</main>
<script>
(function(){
  'use strict';
  const status=document.getElementById('status');
  function openTeamIntro(){
    try{
      localStorage.setItem('csms_video_template_mode','team_intro');
      localStorage.setItem('csms_team_intro_direct_open','1');
      status.textContent='Opening Studio...';
      location.href='./?teamIntro=1&cache=20260830-team-introduction-safe';
    }catch(err){
      status.textContent='Could not set Team Introduction mode. Use the normal Studio button.';
    }
  }
  document.getElementById('openStudio').addEventListener('click',openTeamIntro);
})();
</script>
</body>
</html>
