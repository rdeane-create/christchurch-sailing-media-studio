<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Christchurch Team Introduction Builder</title>
<style>
:root{--navy:#07152f;--orange:#ff6f18;--ink:#10213c;--line:#dbe3ee;--muted:#63748a}*{box-sizing:border-box}body{margin:0;background:#eef2f7;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.app{max-width:1160px;margin:auto;padding:18px;display:grid;grid-template-columns:320px 1fr;gap:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}h1{margin:0 0 6px;font-size:22px;color:var(--navy)}p{margin:0 0 10px;color:var(--muted);line-height:1.4}label{display:block;font-size:13px;font-weight:800;margin:12px 0 6px}input,select,button{font:inherit}input[type=text],select{width:100%;padding:10px;border:1px solid #cbd6e4;border-radius:9px}input[type=file]{width:100%;font-size:13px}button{border:0;border-radius:9px;background:#e9eef6;color:#163052;font-weight:800;padding:11px 12px;cursor:pointer}.primary{background:var(--orange);color:#fff;width:100%}.actions{display:grid;gap:8px;margin-top:12px}.stage{background:#08152e;border-radius:14px;min-height:620px;display:grid;place-items:center;padding:14px}.placeholder{color:#fff;text-align:center;max-width:420px}.placeholder strong{display:block;font-size:28px;margin-bottom:8px}canvas{display:none;width:min(100%,520px);height:auto;aspect-ratio:4/5;background:#07152f;border-radius:10px;box-shadow:0 18px 45px rgba(0,0,0,.35)}.hint{font-size:12px;color:#66758a;margin-top:6px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:820px){.app{grid-template-columns:1fr}.stage{min-height:420px}}
</style>
</head>
<body>
<div class="app">
<section class="panel">
<h1>Team Introduction</h1>
<p>Standalone builder for large rosters. It does not load the main Studio.</p>
<label for="photos">Team headshots</label><input id="photos" type="file" accept="image/*" multiple>
<div class="hint">Choose the headshots, then click Build Preview.</div>
<label for="title">Bottom line</label><input id="title" type="text" value="Introducing your 2026/2027 Seahorses">
<div class="row"><div><label for="columns">Columns</label><select id="columns"><option>6</option><option selected>7</option><option>8</option><option>9</option><option>10</option></select></div><div><label for="fit">Fit</label><select id="fit"><option value="cover" selected>Fill</option><option value="contain">Fit</option></select></div></div>
<div class="actions"><button id="build" class="primary" type="button">Build Preview</button><button id="download" type="button">Download PNG</button><button id="clear" type="button">Clear</button></div>
<div id="status" class="hint">Ready. No image processing has started.</div>
</section>
<section class="stage"><div id="placeholder" class="placeholder"><strong>Ready</strong><span>Select photos, then build the preview.</span></div><canvas id="canvas" width="1080" height="1350"></canvas></section>
</div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);const canvas=$('canvas'),ctx=canvas.getContext('2d'),status=$('status'),placeholder=$('placeholder');let images=[];
function msg(t){status.textContent=t}
function fitDraw(img,x,y,w,h,mode){const iw=img.naturalWidth,ih=img.naturalHeight,ir=iw/ih,or=w/h;let sx=0,sy=0,sw=iw,sh=ih,dx=x,dy=y,dw=w,dh=h;if(mode==='cover'){if(ir>or){sw=ih*or;sx=(iw-sw)/2}else{sh=iw/or;sy=(ih-sh)/2}}else{if(ir>or){dh=w/ir;dy=y+(h-dh)/2}else{dw=h*ir;dx=x+(w-dw)/2}}ctx.drawImage(img,sx,sy,sw,sh,dx,dy,dw,dh)}
function draw(){const W=1080,H=1350;ctx.fillStyle='#07152f';ctx.fillRect(0,0,W,H);ctx.fillStyle='rgba(255,255,255,.96)';ctx.font='900 54px Arial,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('CHRISTCHURCH SAILING',W/2,72);ctx.fillStyle='#ff6f18';ctx.fillRect(210,104,660,8);const footerH=170,margin=54,gap=8,cols=Number($('columns').value)||7,rows=Math.max(1,Math.ceil(images.length/cols));const y0=136,areaH=H-footerH-y0-36,tileW=(W-margin*2-gap*(cols-1))/cols,tileH=(areaH-gap*(rows-1))/rows;images.forEach((img,i)=>{const col=i%cols,row=Math.floor(i/cols),x=margin+col*(tileW+gap),y=y0+row*(tileH+gap);ctx.save();ctx.beginPath();ctx.rect(x,y,tileW,tileH);ctx.clip();ctx.fillStyle='#dce4ee';ctx.fillRect(x,y,tileW,tileH);fitDraw(img,x,y,tileW,tileH,$('fit').value);ctx.restore();ctx.strokeStyle='rgba(255,255,255,.28)';ctx.lineWidth=2;ctx.strokeRect(x,y,tileW,tileH)});const fg=ctx.createLinearGradient(0,H-footerH-70,0,H);fg.addColorStop(0,'rgba(7,21,47,0)');fg.addColorStop(.35,'rgba(7,21,47,.92)');fg.addColorStop(1,'rgba(7,21,47,1)');ctx.fillStyle=fg;ctx.fillRect(0,H-footerH-70,W,footerH+70);ctx.fillStyle='#ff6f18';ctx.fillRect(90,H-116,900,7);ctx.fillStyle='#fff';ctx.font='800 46px Arial,sans-serif';ctx.fillText($('title').value||'Introducing your 2026/2027 Seahorses',W/2,H-54);canvas.style.display='block';placeholder.style.display='none';msg(images.length+' photos loaded.')}
async function build(){const files=[...$('photos').files];if(!files.length){msg('Choose photos first.');return}images=[];msg('Loading photos...');for(let i=0;i<files.length;i++){await new Promise(r=>setTimeout(r,0));const url=URL.createObjectURL(files[i]);const img=new Image();await new Promise(resolve=>{img.onload=resolve;img.onerror=resolve;img.src=url});if(img.naturalWidth)images.push(img);msg('Loaded '+images.length+' of '+files.length)}draw()}
$('build').addEventListener('click',()=>build().catch(e=>msg('Build failed: '+e.message)));
$('download').addEventListener('click',()=>{if(!images.length){msg('Build preview first.');return}draw();const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='christchurch-team-introduction.png';a.click()});
$('clear').addEventListener('click',()=>{images=[];$('photos').value='';canvas.style.display='none';placeholder.style.display='block';msg('Ready. No image processing has started.')});
})();
</script>
</body>
</html>
